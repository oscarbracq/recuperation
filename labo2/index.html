<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Labo 2 · Atlas</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--fg:#0f1b2d;--mut:#6b7689;--navy:#0e2a47;--ac:#e5484d;--sh-bg:#fff;--sh-fg:#0f1b2d;--sh-ac:#0e2a47}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Manrope,system-ui,sans-serif}
.top{position:sticky;top:0;z-index:4;background:rgba(243,245,249,.9);backdrop-filter:blur(12px);padding:14px 16px 10px}.top .in{max-width:1000px;margin:auto}
.t1{display:flex;align-items:center;gap:10px}.t1 h1{margin:0;font-size:24px;font-weight:800}.ia{margin-left:auto;border:0;background:var(--navy);color:#fff;border-radius:12px;padding:9px 13px;font:700 13px Manrope;cursor:pointer}
.seg{display:flex;background:#e3e8ef;border-radius:14px;padding:4px;margin-top:12px;position:relative}.seg button{flex:1;border:0;background:none;padding:9px;font:700 14px Manrope;color:var(--mut);border-radius:10px;cursor:pointer;position:relative;z-index:1;transition:color .3s}
.seg .on{color:var(--fg)}.seg i{position:absolute;top:4px;bottom:4px;border-radius:10px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);transition:left .4s cubic-bezier(.3,1.3,.5,1),width .4s}
main{max-width:1000px;margin:auto;padding:6px 16px 40px}.pg{animation:in .45s ease both}@keyframes in{from{opacity:0;transform:scale(.98)}}
.card{background:#fff;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,27,45,.06)}.mut{color:var(--mut);font-size:13px}
.bodies{display:grid;grid-template-columns:1fr 1fr;gap:6px;position:relative}.bodies svg [data-m]{cursor:pointer;transition:opacity .2s}.bodies svg [data-m]:hover{opacity:.7}
.lbl{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.lbl span{background:#f0f3f7;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:700}
.tiles{display:grid;gap:12px}.tile{position:relative;height:110px;border-radius:18px;background:var(--navy);color:#fff;overflow:hidden;display:flex;align-items:center;padding:0 20px;font-size:20px;font-weight:800;cursor:pointer;transition:transform .2s}
.tile:active{transform:scale(.97)}.tile svg{position:absolute;right:-10px;top:-14px;width:120px;opacity:.95}.tile small{display:block;font-size:12px;font-weight:600;opacity:.7}
.leg{display:flex;gap:14px;justify-content:center;font-size:12px;margin-top:8px}.leg span:before{content:'';display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:5px;vertical-align:-1px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eef1f5}.row:last-child{border:0}.row b{flex:1;min-width:0}
.go{width:100%;padding:14px;border:0;border-radius:14px;background:var(--navy);color:#fff;font:800 15px Manrope;cursor:pointer;margin-top:10px}
.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.kpi div{background:#fff;border-radius:16px;padding:12px}.kpi b{font-size:22px;display:block}
.anal .bar{border-radius:4px}.pct{font-weight:800}
@media(min-width:900px){.cols{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}.tiles{grid-template-columns:1fr 1fr}}
</style></head><body>
<div class="top"><div class="in"><div class="t1"><h1>Atlas</h1><button class="ia" onclick="D.ai()">✦ IA</button></div><div class="seg" id="seg"></div></div></div>
<main id="m"></main>
<script src="../labx/data.js"></script>
<script>
let tab='corps';const TABS=[['corps','Corps'],['exos','Exercices'],['plan','Planning'],['anal','Analyse']];
const tileBody=s=>`<svg viewBox="0 0 120 194">${D.body(s,v=>v<70?'#e5484d':'#c9d3e0').replace(/<\/?svg[^>]*>/g,'')}</svg>`;
const P={
corps:()=>`<div class="cols"><div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><b style="font-size:18px">Récupération musculaire</b><span class="mut">${D.jour}</span></div>
<div class="bodies">${D.body('front')}${D.body('back')}</div><div class="leg"><span style="--c:#2fd4a3">Prêt</span><span style="--c:#ffc23d">Moyen</span><span style="--c:#ff4d6d">Fatigué</span></div><p class="mut" style="text-align:center">Touche un muscle pour voir quoi faire</p></div>
<div><div class="kpi"><div><span class="mut">Forme</span><b data-n="${D.forme}">0</b></div><div><span class="mut">Sommeil</span><b>${D.sommeil.h}</b></div><div><span class="mut">VFC</span><b data-n="${D.vfc}">0</b></div></div>
<div class="card" style="margin-top:12px"><b>Prêt pour aujourd'hui</b>${D.muscles.slice().sort((a,b)=>b.v-a.v).slice(0,10).map(m=>`<div class="row" onclick="mus('${m.n}')"><b>${m.n}</b><div style="width:90px;height:6px;background:#eef1f5;border-radius:6px;overflow:hidden"><div style="width:${m.v}%;height:100%;background:${D.zone(m.v)}"></div></div><span class="pct" style="width:44px;text-align:right">${m.v}%</span></div>`).join('')}</div></div></div>`,
exos:()=>`<input placeholder="🔍  Chercher un exercice" style="width:100%;padding:13px 14px;border-radius:14px;border:0;background:#fff;font:600 15px Manrope;margin-bottom:12px">
<div class="tiles">${Object.keys(D.exos).map((c,i)=>`<div class="tile" onclick="cat('${c}')">${c}<small>&nbsp;· ${D.exos[c].length} exercices</small>${tileBody(i%2?'back':'front')}</div>`).join('')}</div><button class="go" onclick="D.builder()">+ Créer une séance avec ces exercices</button>`,
plan:()=>`<div class="card"><b>Semaine 46</b>${D.semaine.map(d=>`<div class="row"><div style="width:44px;text-align:center"><div class="mut">${d.j}</div><b style="font-size:20px">${d.num}</b></div><div style="width:4px;align-self:stretch;border-radius:4px;background:${D.col(d.t)}"></div><b>${d.n}${d.auj?' <span class="mut">· aujourd\'hui</span>':''}</b><span>${d.fait?'✓':'›'}</span></div>`).join('')}<button class="go" onclick="D.seanceSheet()">Voir la séance du jour</button></div>`,
anal:()=>`<div class="cols"><div class="card anal"><b>Volume par muscle · 7 jours</b><div style="margin-top:12px">${D.bars(D.muscles.map(m=>100-m.v+12),140,(v)=>v>40?'#e5484d':'#0e2a47',D.muscles.map(m=>m.n.slice(0,4)))}</div></div>
<div class="card"><b>Forme · 90 jours</b>${D.spark(D.hist.forme,300,110,'#0e2a47')}<b>VFC</b>${D.spark(D.hist.vfc,300,80,'#2fd4a3')}</div></div>
<div class="card"><b>Records</b>${D.records.map(r=>`<div class="row"><b>${r.n}</b><span class="pct">${r.v}</span><span class="mut">${r.e}</span></div>`).join('')}</div>`};
window.mus=n=>{const m=D.muscles.find(x=>x.n===n);D.sheet(`<h3>${n} · ${m.v} %</h3><p class="muted">${m.v<60?'Encore fatigué : évite de le charger aujourd\'hui.':m.v<80?'Récupération moyenne : volume léger.':'Prêt : tu peux le travailler.'}</p>${(D.exos.Force.concat(D.exos.Sprint)).slice(0,4).map(e=>`<div class="ex"><b>${e}</b><span class="muted">${m.v<60?'à éviter':'ok'}</span></div>`).join('')}`)};
window.cat=c=>D.sheet(`<h3>${c}</h3>${D.exos[c].map(e=>`<div class="ex"><b>${e}</b><button class="add" onclick="D.toast('Ajouté à ta séance')">+</button></div>`).join('')}`);
function go(){const s=document.getElementById('seg');s.innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" data-k="${k}">${l}</button>`).join('')+'<i></i>';
const on=s.querySelector('.on'),i=s.querySelector('i');requestAnimationFrame(()=>{i.style.left=on.offsetLeft+'px';i.style.width=on.offsetWidth+'px'});
document.getElementById('m').innerHTML=`<div class="pg">${P[tab]()}</div>`;D.count();
document.querySelectorAll('.bodies [data-m]').forEach(e=>e.onclick=()=>mus(e.dataset.m));}
document.getElementById('seg').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.k;go()}};go();
</script></body></html>
