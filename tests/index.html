<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TNR · 5 tests</title>
<style>body{margin:0;background:#0b0b0d;color:#fff;font-family:system-ui,sans-serif}.w{max-width:640px;margin:auto;padding:24px 16px}h1{font-size:28px;margin:0 0 4px}p{color:#999;margin:0 0 18px}
a{display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;background:#17171b;margin-bottom:10px;color:#fff;text-decoration:none}a b{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:18px}a span{color:#999;font-size:14px;display:block;margin-top:2px}</style></head>
<body><div class="w"><h1>5 applis TNR Test</h1><p>Mêmes blocs, cinq directions artistiques. Données inventées.</p><div id="l"></div></div>
<script>document.getElementById('l').innerHTML=[['Nuit bleue','Sombre, bleu lumineux, barre en verre qui brille','linear-gradient(135deg,#1d4ed8,#7c5cff)'],['Piste','Couleurs de la piste, onglets en couloirs 1-2-3-4, piste animée','#d9480f'],['Cockpit','Graphite et vert citron, tableau de bord en tuiles','#c6ff3d'],['Carnet','Clair, papier et encre, la journée au centre','#e8541c'],['Affiche','Noir, dégradé rouge-orange, gros titres façon affiche','linear-gradient(135deg,#ff3b30,#ff9500)']].map(([n,d,c],i)=>`<a href="../test${i+1}/"><b style="background:${c};color:${i===2?'#000':'#fff'}">${i+1}</b><div>Test ${i+1} · ${n}<span>${d}</span></div></a>`).join('')</script></body></html>
