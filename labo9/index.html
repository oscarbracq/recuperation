<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Labo 9 · Niveau</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f3ff;--fg:#2b2350;--mut:#7d75a3;--g:#58cc02;--b:#1cb0f6;--o:#ff9600;--r:#ff4b4b;--p:#ce82ff;--sh-bg:#fff;--sh-fg:#2b2350;--sh-ac:#58cc02}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Nunito,system-ui,sans-serif}
.top{display:flex;align-items:center;gap:14px;padding:14px 16px;max-width:900px;margin:auto;font-weight:900}.top span{display:flex;align-items:center;gap:4px}.ia{margin-left:auto;border:0;background:var(--p);color:#fff;border-radius:14px;padding:9px 13px;font:900 13px Nunito;box-shadow:0 4px 0 #a35fd6;cursor:pointer}
main{max-width:900px;margin:auto;padding:0 16px 110px}.pg>*{animation:bo .5s cubic-bezier(.3,1.5,.5,1) both}.pg>*:nth-child(2){animation-delay:.06s}.pg>*:nth-child(3){animation-delay:.12s}.pg>*:nth-child(4){animation-delay:.18s}@keyframes bo{from{opacity:0;transform:scale(.85)}}
.card{background:#fff;border:2px solid #e8e2f8;border-radius:22px;padding:16px;margin-bottom:14px}.mut{color:var(--mut);font-size:14px;font-weight:600}
.lvl{display:flex;align-items:center;gap:14px}.badge{width:74px;height:74px;border-radius:22px;background:linear-gradient(160deg,#ffd900,#ff9600);display:grid;place-items:center;font-size:30px;font-weight:900;color:#fff;box-shadow:0 5px 0 #d97a00;flex:none}
.xp{height:16px;border-radius:16px;background:#ece6fb;overflow:hidden;margin-top:6px}.xp i{display:block;height:100%;background:var(--g);border-radius:16px;width:var(--w);animation:gr 1.2s cubic-bezier(.2,.9,.3,1.1) both;box-shadow:inset 0 -4px 0 #46a302}@keyframes gr{from{width:0}}
.q{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;border:2px solid #ece6fb;margin-top:10px;cursor:pointer;transition:transform .15s}.q:active{transform:scale(.97)}.q .i{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none}.q b{flex:1}.q.ok{background:#e9f9dc;border-color:var(--g)}.q.ok .ch{color:var(--g)}
.ch{font-size:22px;color:#d4cdee}.big{width:100%;border:0;border-radius:18px;padding:16px;font:900 18px Nunito;color:#fff;background:var(--g);box-shadow:0 5px 0 #46a302;cursor:pointer;margin-top:12px;text-transform:uppercase}.big:active{transform:translateY(4px);box-shadow:0 1px 0 #46a302}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0}.node{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:28px;border:0;box-shadow:0 6px 0 rgba(0,0,0,.18);cursor:pointer;color:#fff}.node.lock{background:#e5e0f3!important;color:#b3aacd}.node.now{animation:pul 1.5s infinite}@keyframes pul{50%{transform:scale(1.08)}}
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.badges div{text-align:center;font-size:12px;font-weight:800}.badges i{display:grid;place-items:center;height:64px;border-radius:18px;font-size:30px;font-style:normal;margin-bottom:4px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #ece6fb;display:flex;justify-content:space-around;padding:8px 8px 14px;z-index:5}nav button{border:2px solid transparent;background:none;border-radius:14px;padding:8px 14px;font-size:24px;cursor:pointer}nav .on{border-color:var(--b);background:#ddf4ff}
.cf{position:fixed;width:10px;height:14px;top:-20px;z-index:99;animation:fall 1.6s ease-in forwards}@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@media(min-width:900px){.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}}
</style></head><body>
<div class="top"><span>🔥 12</span><span style="color:var(--b)">💎 340</span><span style="color:var(--r)">❤ ${''}</span><button class="ia" onclick="D.ai()">✦ IA</button></div>
<main id="m"></main><nav id="n"></nav>
<script src="../labx/data.js"></script>
<script>
document.querySelectorAll('.top span')[2].textContent='❤ '+D.forme;
let tab='quest';const Q=[['😴','Sommeil noté',D.sommeil.h+' · +10 XP','#a99bff',1],['💧','Boire 3 L d\'eau',D.macros.eau[0]+' / 3 L · +15 XP','#1cb0f6',0],['🍗','165 g de protéines',D.macros.p[0]+' / 165 g · +20 XP','#ff9600',0],['⚡',D.seance.nom,D.seance.duree+' min · +50 XP','#58cc02',0],['🧘','Mobilité 10 min','+10 XP','#ce82ff',0]];
const T={quest:['🎯',()=>`<div class="card lvl"><div class="badge">14</div><div style="flex:1"><b style="font-size:18px">Niveau 14 · Sprinteur</b><div class="xp"><i style="--w:68%"></i></div><div class="mut">680 / 1000 XP · forme ${D.forme} aujourd'hui</div></div></div>
<div class="card"><b style="font-size:18px">Quêtes du jour</b>${Q.map((q,i)=>`<div class="q ${q[4]?'ok':''}" onclick="quest(${i})"><div class="i" style="background:${q[3]}22">${q[0]}</div><b>${q[1]}<div class="mut">${q[2]}</div></b><span class="ch">${q[4]?'✔':'○'}</span></div>`).join('')}</div>
<div class="card"><b>Conseil du coach</b><p class="mut" style="font-size:15px">${D.conseils[0]}</p><button class="big" onclick="D.seanceSheet()">C'est parti !</button></div>`],
path:['🗺',()=>`<div class="card"><b style="font-size:18px">Programme · Bloc vitesse</b><div class="mut">Séance 9 sur 36</div></div><div class="path">${D.biblio.concat(D.biblio).slice(0,10).map((b,i)=>`<button class="node ${i>8?'lock':''} ${i===8?'now':''}" style="background:${D.col(b.t)};margin-left:${Math.sin(i*1.1)*90}px" onclick="${i<=8?'D.seanceSheet()':'D.toast(\'Termine les séances avant\')'}" title="${b.n}">${i<8?'✔':i===8?'⚡':'🔒'}</button>`).join('')}</div><button class="big" style="background:var(--b);box-shadow:0 5px 0 #1491cc" onclick="D.builder()">+ Créer ma séance</button>`],
corps:['💪',()=>`<div class="two"><div class="card" style="display:flex;gap:8px;max-width:340px;margin:auto">${D.body('front')}${D.body('back')}</div><div class="card"><b>Barres de vie</b>${D.muscles.map(m=>`<div style="margin-top:9px"><div style="display:flex;justify-content:space-between;font-weight:800"><span>${m.n}</span><span>${m.v}</span></div><div class="xp" style="height:12px"><i style="--w:${m.v}%;background:${D.zone(m.v)};box-shadow:none"></i></div></div>`).join('')}</div></div>`],
trophy:['🏆',()=>`<div class="card"><b style="font-size:18px">Badges</b><div class="badges" style="margin-top:10px">${[['⚡','Sous 3"05','#ffd900'],['🔥','12 jours','#ff9600'],['🏋','150 kg','#1cb0f6'],['😴','7 nuits 7 h','#a99bff'],['🥇','PR 60 m','#58cc02'],['💧','Hydraté','#1cb0f6'],['🔒','Sous 3"00','#eee'],['🔒','100 séances','#eee']].map(([i,l,c])=>`<div><i style="background:${c}">${i}</i>${l}</div>`).join('')}</div></div>
<div class="card"><b>Records</b>${D.records.map(r=>`<div class="q"><div class="i" style="background:#fff3d6">🏅</div><b>${r.n}<div class="mut">${r.d}</div></b><b style="flex:none">${r.v}</b></div>`).join('')}</div>
<div class="card"><b>XP par semaine</b>${D.bars([420,610,380,720,690,810],110,(v)=>v>700?'#58cc02':'#c4b5fd',['S41','S42','S43','S44','S45','S46'])}</div>`]};
window.quest=i=>{Q[i][4]=!Q[i][4];if(Q[i][4]){for(let k=0;k<40;k++){const c=document.createElement('i');c.className='cf';c.style.cssText=`left:${Math.random()*100}vw;background:${['#58cc02','#1cb0f6','#ff9600','#ce82ff','#ffd900'][k%5]};animation-delay:${Math.random()*.4}s`;document.body.append(c);setTimeout(()=>c.remove(),2200)}D.toast('+XP !')}go()};
function go(){document.getElementById('m').innerHTML=`<div class="pg">${T[tab][1]()}</div>`;document.getElementById('n').innerHTML=Object.entries(T).map(([k,[i]])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';go()">${i}</button>`).join('');}
go();
</script></body></html>
