<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Labo 10 · Messages</title>
<style>
:root{--bg:#000;--me:#0a84ff;--it:#1c1c1e;--fg:#fff;--mut:#8e8e93;--sh-bg:#1c1c1e;--sh-ac:#0a84ff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,'Segoe UI',system-ui,sans-serif}
.app{display:flex;flex-direction:column;height:100%;max-width:720px;margin:auto}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #222;background:rgba(0,0,0,.8);backdrop-filter:blur(14px)}.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#ff7a1a,#ff2d55);display:grid;place-items:center;font-weight:800;font-size:13px}
header b{display:block}header small{color:var(--mut)}.ia{margin-left:auto;border:1px solid #333;background:none;color:#fff;border-radius:99px;padding:7px 12px;font-size:13px;cursor:pointer}
.chat{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
.m{max-width:82%;padding:10px 14px;border-radius:20px;line-height:1.35;font-size:16px;animation:pop .35s cubic-bezier(.2,1.2,.4,1) both;transform-origin:left bottom}.it{background:var(--it);align-self:flex-start;border-bottom-left-radius:6px}
.me{background:var(--me);align-self:flex-end;border-bottom-right-radius:6px;transform-origin:right bottom}@keyframes pop{from{opacity:0;transform:scale(.6)}}
.rich{padding:14px;width:82%}.rich .rw{position:relative;display:inline-grid;place-items:center;color:#ff7a1a}.rich .rw b{position:absolute;font-size:30px}
.ln{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid #2c2c2e;font-size:15px}.ln span:last-child{color:var(--mut);text-align:right}
.typing{align-self:flex-start;background:var(--it);border-radius:20px;padding:12px 16px;display:flex;gap:4px}.typing i{width:7px;height:7px;border-radius:50%;background:#777;animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes bl{50%{opacity:.3;transform:translateY(-3px)}}
.qr{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;border-top:1px solid #222;scrollbar-width:none}.qr button{flex:none;border:1px solid var(--me);background:none;color:var(--me);border-radius:99px;padding:9px 14px;font-size:15px;cursor:pointer}
.bar{display:flex;gap:8px;padding:8px 12px 16px}.bar input{flex:1;background:#1c1c1e;border:1px solid #333;border-radius:99px;color:#fff;padding:11px 16px;font-size:16px;outline:none;min-width:0}.bar button{width:42px;height:42px;border-radius:50%;border:0;background:var(--me);color:#fff;font-size:18px;cursor:pointer}
.small{color:var(--mut);font-size:12px;text-align:center;margin:6px 0}.btn{border:0;background:var(--me);color:#fff;border-radius:12px;padding:10px 14px;font-size:15px;font-weight:600;margin-top:10px;cursor:pointer;width:100%}
</style></head><body><div class="app">
<header><div class="av">TNR</div><div><b>Ton carnet</b><small>Répond tout seul, sans IA</small></div><button class="ia" onclick="D.ai()">✦ IA</button></header>
<div class="chat" id="c"></div><div class="qr" id="qr"></div>
<div class="bar"><input id="in" placeholder="Écris : forme, séance, repas, courses…"><button onclick="send()">↑</button></div></div>
<script src="../labx/data.js"></script>
<script>
const c=document.getElementById('c');
const R={
'Ma forme':()=>[`Forme <b>${D.forme}</b> : ${D.formeMot.toLowerCase()} 💪`,`<div class="rich-in" style="display:flex;gap:14px;align-items:center"><span class="rw">${D.ring(D.forme,90,9,'#ff7a1a','#333')}<b>${D.forme}</b></span><div><div>😴 ${D.sommeil.h}</div><div>❤ VFC ${D.vfc} ms</div><div>⚡ Charge ${D.charge}</div></div></div>`,D.conseils[0]],
'Ma séance':()=>[`Aujourd'hui ${D.seance.heure} : <b>${D.seance.nom}</b>`,D.seance.items.map(x=>`<div class="ln"><span>${x.n}</span><span>${x.s?x.s+' × '+x.r:x.d}</span></div>`).join('')+'<button class="btn" onclick="D.seanceSheet()">Commencer</button>'],
'Mes repas':()=>[`Tu en es à <b>${D.macros.kcal[0]}</b> kcal sur ${D.macros.kcal[1]}, et ${D.macros.p[0]} g de protéines sur ${D.macros.p[1]}.`,D.repas.map(r=>`<div class="ln"><span>${r.fait?'✅':'⏳'} ${r.h} ${r.n}</span><span>${r.k} kcal</span></div>`).join(''),D.conseils[2]],
'Mes muscles':()=>['Voilà où en sont tes muscles :',`<div style="display:flex;gap:8px;max-width:220px">${D.body('front')}${D.body('back')}</div>`,D.conseils[1]],
'Ma semaine':()=>['Semaine 46, 5 séances sur 6 :',D.semaine.map(d=>`<div class="ln"><span>${d.j} ${d.num}</span><span>${d.n} ${d.fait?'✓':''}</span></div>`).join('')],
'Mes records':()=>['Tes meilleurs chronos 🏅',D.records.map(r=>`<div class="ln"><span>${r.n}</span><span>${r.v} · ${r.e}</span></div>`).join(''),`<div style="color:#30d158">${D.spark(D.hist.vitesse,300,70,'#30d158')}</div>`],
'Mes courses':()=>[`Liste de la semaine : <b>${D.eur(D.courses.reduce((a,x)=>a+x.p,0))}</b>`,D.courses.map(x=>`<div class="ln"><span>${x.n}</span><span>${D.eur(x.p)}</span></div>`).join('')],
'Créer une séance':()=>{setTimeout(D.builder,500);return['J\'ouvre le créateur 👇']}};
const K=Object.keys(R);document.getElementById('qr').innerHTML=K.map(k=>`<button>${k}</button>`).join('');
document.getElementById('qr').onclick=e=>{const b=e.target.closest('button');if(b)ask(b.textContent)};
const add=(h,cls)=>{const d=document.createElement('div');d.className='m '+cls+(h.startsWith('<div')?' rich':'');d.innerHTML=h;c.append(d);c.scrollTop=c.scrollHeight;return d};
const say=async a=>{for(const h of a){const t=document.createElement('div');t.className='typing';t.innerHTML='<i></i><i></i><i></i>';c.append(t);c.scrollTop=c.scrollHeight;await new Promise(r=>setTimeout(r,450));t.remove();add(h,'it')}};
window.ask=q=>{add(q,'me');const k=K.find(k=>k.toLowerCase().split(' ').some(w=>w.length>3&&q.toLowerCase().includes(w.slice(0,5))))||K.find(k=>k===q);say(k?R[k]():['Je n\'ai pas compris. Touche un des boutons en bas, ou ✦ IA pour une vraie discussion.'])};
window.send=()=>{const i=document.getElementById('in');if(i.value.trim()){ask(i.value.trim());i.value=''}};document.getElementById('in').onkeydown=e=>{if(e.key==='Enter')send()};
c.innerHTML=`<div class="small">${D.jour} · ${D.heure}</div>`;say(['Salut coach 👋',`Forme <b>${D.forme}</b> ce matin, nuit de ${D.sommeil.h}. ${D.formeMot} !`,`Au programme à ${D.seance.heure} : <b>${D.seance.nom}</b>. Qu'est-ce que tu veux voir ?`]);
</script></body></html>
