<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#B5CEFA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1A40" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
#login,#setpw{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
#login form,#setpw form{width:min(360px,100%);display:flex;flex-direction:column;gap:12px;text-align:center;position:relative;z-index:1}
#login .logo,#setpw .logo{width:72px;height:72px;margin:0 auto 8px;border-radius:18px;background:linear-gradient(135deg,#2F7BF5,#1D4ED8);color:#fff;font:700 44px/72px system-ui,sans-serif}
#login input,#setpw input{font:inherit;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
#login .msg,#setpw .msg{font-size:.875rem;color:var(--fg2);min-height:1.4em;margin:0}
</style>
</head>
<body>
<div id="login" hidden><form><div class="logo">R</div><h1 style="margin:0">Récupération</h1><input name="email" type="email" required autocomplete="email" placeholder="ton e-mail"><input name="password" type="password" required autocomplete="current-password" placeholder="ton mot de passe"><button class="btn" type="submit">Se connecter</button><p class="msg"></p><button class="link" type="button" style="background:none;border:0;color:var(--fg2);font:inherit;font-size:.8125rem;text-decoration:underline">Pas encore de mot de passe ? Recevoir un lien par mail</button></form></div>
<div id="setpw" hidden><form><div class="logo">R</div><h1 style="margin:0;font-size:1.375rem">Choisis ton mot de passe</h1><p class="small muted" style="margin:0">Pour ouvrir l'appli sur n'importe quel navigateur avec <b class="who"></b>.</p><input name="password" type="password" autocomplete="new-password" placeholder="nouveau mot de passe"><button class="btn" type="submit">Enregistrer</button><p class="msg"></p><button class="later" type="button" style="background:none;border:0;color:var(--fg2);font:inherit;font-size:.8125rem">Plus tard</button></form></div><title>Récupération</title>

<style>
/* Layout: iOS-style grouped list — centered header, recovery gauge hero, 2-column metric tiles that open a detail sheet with a scrubbable chart, translucent tab bar */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F2F2F6; --fg:#111114; --fg2:#6B6B73; --fg3:#A3A3AB;
  --line:rgba(60,60,67,.14); --accent:#2F7BF5; --accent-soft:rgba(47,123,245,.12); --orange:#D44A2A;
  --good:#22B04F; --warn:#E8900A; --bad:#EE3A2E; --blue:#2F7BF5; --violet:#8E6CF0; --teal:#1AA6B7;
  --bar:rgba(249,249,251,.8); --scrim:rgba(0,0,0,.32); --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
  --aura1:#7FB0FF; --aura2:#9ED8FF; --aura3:#A7B4FF; --aura-o:.6; --top:#B5CEFA;
  --font:system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --display:system-ui,-apple-system,"SF Pro Display","Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --card2:#2A2A2D; --fg:#F5F5F7; --fg2:#9C9CA4; --fg3:#5E5E66;
  --line:rgba(235,235,245,.12); --accent:#4C8FFF; --accent-soft:rgba(76,143,255,.18); --orange:#FF6A45;
  --good:#32D46A; --warn:#FFAE2E; --bad:#FF5147; --blue:#4C8FFF; --violet:#A68BFF; --teal:#3CC8D8;
  --bar:rgba(22,22,24,.8); --scrim:rgba(0,0,0,.55); --shadow:none; color-scheme:dark;
  --aura1:#1D4ED8; --aura2:#0369A1; --aura3:#3730A3; --aura-o:.5; --top:#0B1A40}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#2A2A2D; --fg:#F5F5F7; --fg2:#9C9CA4; --fg3:#5E5E66;
  --line:rgba(235,235,245,.12); --accent:#4C8FFF; --accent-soft:rgba(76,143,255,.18); --orange:#FF6A45;
  --good:#32D46A; --warn:#FFAE2E; --bad:#FF5147; --blue:#4C8FFF; --violet:#A68BFF; --teal:#3CC8D8;
  --bar:rgba(22,22,24,.8); --scrim:rgba(0,0,0,.55); --shadow:none; color-scheme:dark;
  --aura1:#1D4ED8; --aura2:#0369A1; --aura3:#3730A3; --aura-o:.5; --top:#0B1A40}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--font);-webkit-font-smoothing:antialiased}
/* No browser pull-down-to-reload at the top: refreshing is the pull up at the bottom of each page. */
html,body{overscroll-behavior-y:none}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(100px + env(safe-area-inset-bottom,0px))}
.top{text-align:center;margin:4px 0 16px}
.top .sub{color:var(--fg2);font-size:.9375rem}
.top .sub::first-letter{text-transform:uppercase}
h1{font:700 2.125rem/1.1 var(--display);letter-spacing:-.025em;margin:2px 0 0;text-wrap:balance}
h1.hello{font-size:1.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h2{font:600 1.25rem/1.2 var(--display);letter-spacing:-.015em;margin:28px 4px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font:400 .8125rem var(--font);color:var(--fg2);letter-spacing:0}
.eyebrow{font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2)}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--fg2)} .small{font-size:.8125rem}
.note{font-size:.8125rem;color:var(--fg2);padding:0 4px;margin:14px 0 0;text-align:center}
p{margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:14px;background:var(--accent);color:#fff;font-weight:600;font-size:1.0625rem;transition:transform .1s ease-out,opacity .1s}
.btn:active{transform:scale(.97);opacity:.9}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:.8125rem;font-weight:600;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.pill.none{color:var(--fg2);background:var(--card2)}

/* Recovery gauge */
.gauge{position:relative;width:min(280px,100%);margin:0 auto}
.gauge svg{width:100%;display:block;overflow:visible}
.gauge .center{position:absolute;left:0;right:0;bottom:2px;text-align:center}
.gauge .center b{display:block;font:700 3.25rem/1 var(--display);letter-spacing:-.04em}
.gauge .center b small{font-size:1.375rem;font-weight:600;letter-spacing:0}
.gauge .center span{font-size:.75rem;color:var(--fg2);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.gscale{display:flex;justify-content:space-between;width:min(300px,100%);margin:6px auto 0;font-size:.6875rem;color:var(--fg3);font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.hero{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.hero .state{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
.rings{display:grid;grid-template-columns:1fr 1.35fr 1fr;align-items:center;gap:6px;margin-top:4px}
.ringbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:0;transition:transform .12s ease-out}
.ringbtn:active{transform:scale(.96)}
.ringbtn svg.ring{width:100%;max-width:96px;display:block}
.ringbtn.main svg.ring{max-width:150px}
.ringbtn b{position:absolute;top:0;left:0;right:0;aspect-ratio:1;max-width:96px;margin:0 auto;display:flex;align-items:center;justify-content:center;font:600 1.25rem/1 var(--display);letter-spacing:-.02em}
.ringbtn.main b{max-width:150px;font-size:2.25rem;letter-spacing:-.035em}
.ringbtn b small{font-size:.55em;font-weight:600;margin-left:1px}
.ringbtn>span{font-size:.75rem;font-weight:600;color:var(--fg2);letter-spacing:.02em}
.target{background:var(--card2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.target b{font:600 1.0625rem var(--display)}
.target b span{font-weight:400;font-size:.875rem}
.effbar{display:flex;gap:3px;margin-top:4px}
.effbar span{height:22px;border-radius:6px;background:var(--line);font-size:.625rem;font-weight:600;color:var(--fg2);display:flex;align-items:center;justify-content:center;letter-spacing:.02em}
.effbar span.on{background:var(--blue);color:#fff}
.hero .summary{font-size:1rem;line-height:1.55;text-align:center;text-wrap:pretty}
.dials{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dial{display:flex;align-items:center;gap:12px;background:var(--card2);border-radius:16px;padding:10px 12px;text-align:left;width:100%}
.dial svg{width:46px;height:46px;flex:none;transform:rotate(-90deg)}
.dial b{display:block;font:600 1.25rem/1.1 var(--display);letter-spacing:-.02em}
.dial span{font-size:.75rem;color:var(--fg2)}
.todo{border-top:1px solid var(--line);padding-top:12px}
.todo ul{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.todo li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:.9375rem}
.todo li b{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:.75rem}

/* Tiles */
.tile{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column;gap:4px;text-align:left;width:100%;transition:transform .12s ease-out}
.tile:active{transform:scale(.97)}
.tile .lab{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:.8125rem;font-weight:600;color:var(--c)}
.tile .lab span{display:flex;align-items:center;gap:6px;min-width:0}
.tile .lab svg{width:15px;height:15px;flex:none}
.tile .lab .chev{width:12px;height:12px;color:var(--fg3)}
.tile .big{font:600 1.625rem/1.1 var(--display);letter-spacing:-.02em;margin-top:4px}
.tile .big small{font-size:.875rem;font-weight:500;color:var(--fg2);margin-left:3px;letter-spacing:0}
.tile .sub2{font-size:.75rem;color:var(--fg2);min-height:1.1em}
.tile .sub2 .up{color:var(--good)} .tile .sub2 .down{color:var(--bad)}
.range{position:relative;height:6px;border-radius:99px;background:var(--card2);margin:10px 0 4px}
.range .zone{position:absolute;top:0;bottom:0;border-radius:99px;background:color-mix(in srgb,var(--good) 35%,transparent)}
.range i{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--cur,var(--fg));border:3px solid var(--card);box-shadow:0 1px 4px rgba(0,0,0,.25);transform:translate(-50%,-50%)}
.rlab{display:flex;justify-content:space-between;font-size:.625rem;color:var(--fg3);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.tile svg.mini{width:100%;height:30px;display:block;margin-top:8px}

/* Sessions */
.sess{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:12px 16px;width:100%;text-align:left}
.sess+.sess{border-top:1px solid var(--line)}
.sess .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent)}
.sess .ic svg{width:20px;height:20px}
.sess b{display:block;font-weight:600;font-size:.9375rem}
.sess .meta{font-size:.8125rem;color:var(--fg2)}
.sess .eff{font:600 .9375rem var(--display);padding:5px 10px;border-radius:99px;background:var(--card2);font-variant-numeric:tabular-nums}

/* Charts */
.chartbox{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:crosshair}
.chart{width:100%;display:block;overflow:visible}
.chart text{fill:var(--fg2);font:10px var(--font)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .scrub{stroke:var(--fg2);stroke-width:1;stroke-dasharray:3 3}
.bubble{position:absolute;top:-6px;transform:translate(-50%,-100%);background:var(--fg);color:var(--bg);border-radius:10px;padding:5px 9px;font-size:.75rem;line-height:1.3;white-space:nowrap;pointer-events:none;text-align:center;font-variant-numeric:tabular-nums}
.bubble b{font-size:.875rem}
.bubble em{font-style:normal;display:block;font-size:.6875rem;opacity:.75}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:34px}
.chead b{font:600 1.375rem/1 var(--display);letter-spacing:-.02em}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--fg2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;padding:7px 10px;border-radius:8px;font-size:.8125rem;font-weight:600;color:var(--fg2);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Detail */
.dhead{text-align:center;padding:18px 0 6px}
.dhead .big{font:700 2.75rem/1 var(--display);letter-spacing:-.03em;margin-top:4px}
.dhead .big small{font-size:1.125rem;font-weight:500;color:var(--fg2);margin-left:4px;letter-spacing:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--card2);border-radius:12px;padding:8px 4px}
.stats b{display:block;font:600 1rem var(--display);font-variant-numeric:tabular-nums}
.stats span{font-size:.6875rem;color:var(--fg2)}
.why{font-size:.9375rem;line-height:1.5}
.sci{font-size:.8125rem;line-height:1.5;color:var(--fg2)}

/* Reports */
.rep h3{font:600 1.125rem/1.25 var(--display);margin:8px 0 4px;letter-spacing:-.01em}
.rep section{margin-top:14px}
.rep ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.rep p{margin-top:6px}
.tag{font-size:.75rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.tag.good{color:var(--good)} .tag.warn{color:var(--warn)} .tag.bad{color:var(--bad)} .tag.acc{color:var(--accent)}

/* Timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:18px 1fr;gap:12px;padding-bottom:16px;position:relative}
.tl li::after{content:"";position:absolute;left:8px;top:22px;bottom:2px;width:2px;background:var(--line)}
.tl li:last-child{padding-bottom:0} .tl li:last-child::after{display:none}
.tl .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--fg3);background:var(--card);margin-top:2px}
.tl li.done .dot{background:var(--good);border-color:var(--good)}
.tl li.now .dot{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tl b{display:block;font-weight:600}

/* Lists / form */
.list{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;min-height:50px}
.row+.row{border-top:1px solid var(--line)}
.row label,.row .l{flex:1;min-width:0}
.row .hint{display:block;font-size:.75rem;color:var(--fg2)}
.row input[type=date],.row input[type=number]{font:inherit;color:var(--fg);background:var(--card2);border:0;border-radius:10px;padding:8px 10px;width:110px;text-align:right;font-variant-numeric:tabular-nums}
.row.col{flex-direction:column;align-items:stretch;gap:8px}
.rangeline{display:flex;align-items:center;gap:12px}
.rangeline output{width:52px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;accent-color:var(--accent);height:28px}
textarea{width:100%;font:inherit;color:var(--fg);background:var(--card2);border:0;border-radius:12px;padding:10px 12px;resize:vertical}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--fg3);transition:background .2s}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.switch input:checked+span{background:var(--good)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
/* Background identity: Sprint Lab is the blue app (nutrition will be green, training red). Large, very soft blue glows drift slowly behind the cards. */
.aura{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aura span{position:absolute;border-radius:50%;filter:blur(80px);opacity:var(--aura-o);will-change:transform}
.aura span:nth-child(1){width:70vmax;height:70vmax;left:-35vmax;top:-20vmax;background:var(--aura1);animation:drift1 38s ease-in-out infinite alternate}
.aura span:nth-child(2){width:60vmax;height:60vmax;right:-32vmax;top:25vh;background:var(--aura2);animation:drift2 46s ease-in-out infinite alternate}
.aura span:nth-child(3){width:55vmax;height:55vmax;left:-25vmax;bottom:-30vmax;background:var(--aura3);animation:drift3 52s ease-in-out infinite alternate}
.aura span:nth-child(4){width:40vmax;height:40vmax;right:-20vmax;bottom:-15vmax;background:var(--aura1);animation:drift2 60s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(12vmax,10vmax) scale(1.1)}}
@keyframes drift2{to{transform:translate(-14vmax,-8vmax) scale(.92)}}
@keyframes drift3{to{transform:translate(10vmax,-12vmax) scale(1.08)}}
.wrap{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){.aura span{animation:none}}
.grid>:last-child:nth-child(odd){grid-column:1/-1}
.foot{margin-top:28px}
.srcs{display:flex;justify-content:center;gap:16px;font-size:.75rem;color:var(--fg2);font-variant-numeric:tabular-nums}
.srcs span{display:flex;align-items:center;gap:6px}
.srcs i{width:8px;height:8px;border-radius:50%}
.srcs i.ok{background:var(--good)} .srcs i.late{background:var(--warn)} .srcs i.off{background:var(--fg3)}
.foot a{color:var(--blue)}
.ptr{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;margin-top:12px;padding:12px;color:var(--fg2);font-size:.8125rem;opacity:0;transition:transform .35s cubic-bezier(.32,.72,0,1),color .15s,opacity .2s}
.ptr.pull,.ptr.ready,.ptr.busy{opacity:1}
.ptr .spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--blue);transition:transform .2s}
.ptr.ready{color:var(--blue)} .ptr.ready .spin{transform:rotate(180deg)}
.ptr.busy .spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ptr.busy .spin{animation:none;border-color:var(--blue)}}
.conns{display:grid;grid-template-columns:repeat(4,1fr);text-align:center}
.conn{display:flex;flex-direction:column;align-items:center;gap:4px}
.conn .bub{position:relative;width:60px;height:60px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--fg)}
.conn .bub svg{width:48px;height:48px}
.conn .bub i{position:absolute;right:3px;top:3px;width:12px;height:12px;border-radius:50%;border:2px solid var(--card)}
.conn .bub i.ok{background:var(--good)} .conn .bub i.late{background:var(--warn)} .conn .bub i.off{background:var(--fg3)}
.conn .bub.empty{background:transparent;box-shadow:none;border:1.5px dashed var(--fg3);color:var(--fg3);font-size:1.5rem;font-weight:300}
.conn b{font-size:.75rem;font-weight:600}
.conn>span:last-child{font-size:.6875rem;color:var(--fg2);font-variant-numeric:tabular-nums}
.miniwrap{position:relative;height:30px;margin-top:8px}

/* ---------- periods: Jour = that day, Semaine = its 7 days, Mois = its weeks, Année = its 12 months ---------- */

const PHASES = [['Sans impact', 'var(--fg3)'], ['Course aérobie', 'var(--blue)'], ['Course intense', 'var(--warn)'], ['Sprint', 'var(--bad)']];

// Pace over the whole session is useless here because sessions mix walking and running.
function runLevel(a) {
  if (!/running|track/.test(a.type)) return 0;
  const r = restHr(), hrr = a.avgHr ? (a.avgHr - r) / (S.hrMax - r) : 0;
  if ((a.vmax || 0) >= 28) return 3;

}
function weekStats(s) {

    const k = addDays(s, i); if (k > TODAY) break;
    for (const a of G(k, 'acts') || []) { const l = runLevel(a); if (l) { run += a.km || 0; vmax = Math.max(vmax, a.vmax || 0); ph = Math.max(ph, l); } }

function progression() {

  for (let n = 1; n <= cur; n++) { const s = addDays(start, 7 * (n - 1)); weeks.push({n, s, ...weekStats(s)}); }
  // The current week is incomplete, so the level is the highest reached over the last two weeks.
  const phase = Math.max(...weeks.slice(-2).map(w => w.ph));
  const last = weeks.at(-2) || weeks.at(-1), prev = weeks.at(-3);

  if (phase >= 1) {
    ok(gVol == null || gVol <= 15, `Volume ${phase >= 3 ? 'de sprint' : 'de course'} : +15 % maximum par semaine`, gVol == null ? 'pas encore 2 semaines à comparer' : sgn(gVol) + ' la semaine dernière');
    ok(gInt == null || gInt <= 3, 'Intensité (vitesse max) : +3 % maximum par semaine', gInt == null ? 'pas encore 2 semaines à comparer' : sgn(gInt) + ' la semaine dernière');
  }
  ok(rec7 != null && rec7 >= 34, 'Récupération moyenne sur 7 jours au moins modérée', rec7 != null ? fx(rec7) + ' %' : '–');

  return {weeks, phase, C, cur, back};
}

/* ---------- sheet drag: pull down from the top to close, like iOS ---------- */
// Scrolling is native: the card rises to the top and becomes a plain page. Back at the very top,
// pulling further down (anywhere, or on the grey handle) moves the whole sheet down; far enough, it closes.
const sheetEl = $('#sheet'), sheetScroll = $('#sheet-scroll');
let sheetDrag = null, sheetY = 0;

sheetScroll.addEventListener('scroll', () => sheetEl.classList.toggle('flat', sheetScroll.scrollTop >= $('#sheet-gap').offsetHeight - 1), {passive: true});
function setSheetY(y, animate = true) {
  sheetY = y;
  sheetEl.classList.toggle('drag', !animate);
  sheetEl.style.setProperty('--sy', y + 'px');
  // The dimmed background fades with the sheet while it is dragged.
  $('#scrim').style.opacity = animate ? '' : String(Math.max(0, Math.min(1, 1 - y / sheetEl.offsetHeight)));
}

  const go = ptr.d > PTR_GO; ptr.y0 = null; ptr.d = 0;
  const el = ptrEl(); if (el) { el.style.transform = ''; el.classList.remove('ready', 'pull'); }
  if (go) refreshAll();
});
async function refreshAll() {
  if (ptr.busy) return;
  if (!S.db) { toast('Ouvre la page connecté à ton compte'); return; }
  ptr.busy = true;
  const el = ptrEl(); if (el) el.classList.add('busy');
  // The installed app asks Garmin and Withings right away (RECUP_SYNC); elsewhere the request waits for the hourly cloud check.
  // Either way the request is left so the cloud sync also refreshes the advice.
  let msg = 'Demande envoyée · Garmin et Withings relus dans l\'heure', failed = false;
  try {
    await S.db.doc('requests/sync').set({requestedAt: new Date().toISOString()});
    if (window.RECUP_SYNC) msg = await window.RECUP_SYNC();
    await Promise.all([...['garmin', 'withings', 'manual', 'reports'].map(c => S.db.collection(c).get()), S.db.doc('analysis/latest').get(), S.db.doc('profile/main').get(), S.db.doc('status/sync').get()]);
  } catch (e) { failed = true; }
  // What the browser's pull-to-reload used to do: pick up a new version of the app, if there is one.
  try { (await navigator.serviceWorker?.getRegistration?.())?.update(); } catch (e) {}
  REST = null;
  setTimeout(() => {
    ptr.busy = false; render();
    toast(failed ? 'Actualisation impossible, vérifie ta connexion' : msg);
  }, 400);
}
const ptrEl = () => $('#v-' + S.tab + ' [data-ptr]');
document.addEventListener('click', e => { if (e.target.closest('[data-ptr]')) refreshAll(); });

/* ---------- boot ---------- */
try { const t = localStorage.getItem('sl-tab'); if (t && $('#v-' + t)) S.tab = t; const g = localStorage.getItem('sl-gran'); if (GRAN.some(([x]) => x === g)) S.gran = g; } catch (e) {}
setTab(S.tab);
(async () => {
  const db = await recupGetDb();
  if (!db) { S.status = 'offline'; render(); return; }
  S.db = db;
  let fresh = false;
  const timer = setTimeout(() => { if (!fresh) { S.status = 'slow'; render(); } }, 10000);
  const ok = snap => { if (!snap.metadata.fromCache && !fresh) { fresh = true; clearTimeout(timer); S.status = 'ready'; } };
  const fail = () => { clearTimeout(timer); S.status = 'slow'; render(); };
  const months = (col, target) => db.collection(col).onSnapshot(snap => {
    const o = {}; let synced = S.syncedAt;
    let own = null;
    snap.docs.forEach(d => { const x = d.data(); Object.assign(o, x.days || {}); if (x.hrMax) S.hrMax = x.hrMax; if (x.syncedAt && (!own || x.syncedAt > own)) own = x.syncedAt; });
    if (own && (!synced || own > synced)) synced = own;
    S[target] = o; S.syncedAt = synced; (S.sync ||= {})[col] = own; REST = null; ok(snap); render();
  }, fail);
  months('garmin', 'g'); months('withings', 'w');
  db.collection('manual').onSnapshot(snap => { const o = {}; snap.docs.forEach(d => o[d.id] = d.data()); S.manual = o; render(); }, fail);
  db.collection('reports').onSnapshot(snap => { S.reports = snap.docs.map(d => ({id: d.id, ...d.data()})); render(); }, fail);
  db.doc('analysis/latest').onSnapshot(snap => { S.analysis = snap.exists ? snap.data() : null; render(); }, fail);
  db.doc('requests/sync').onSnapshot(snap => { S.req = snap.exists ? snap.data().requestedAt : null; render(); }, () => {});
  db.doc('status/sync').onSnapshot(snap => { S.checked = snap.exists ? snap.data() : null; render(); }, () => {});
  db.doc('profile/main').onSnapshot(snap => { S.profile = snap.exists ? snap.data() : null; render(); }, fail);
})();
</script>
