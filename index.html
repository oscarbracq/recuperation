<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TNR Athletics">
<meta name="application-name" content="TNR Athletics">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=tnr">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=tnr">
<style>
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
#login,#setpw{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
#login form,#setpw form{width:min(360px,100%);display:flex;flex-direction:column;gap:12px;text-align:center;position:relative;z-index:1}
#login .logo,#setpw .logo{display:block;width:80px;height:80px;margin:0 auto 8px;border-radius:18px;box-shadow:0 0 0 1px var(--line),0 6px 18px rgba(11,23,51,.2)}
#login input,#setpw input{font:inherit;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
#login .msg,#setpw .msg{font-size:.875rem;color:var(--fg2);min-height:1.4em;margin:0}
</style>
</head>
<body>
<div id="login" hidden><form><img class="logo" src="icon-192.png?v=tnr" alt="TNR Athletics"><h1 style="margin:0">TNR Athletics</h1><input name="email" type="email" required autocomplete="email" placeholder="ton e-mail"><input name="password" type="password" required autocomplete="current-password" placeholder="ton mot de passe"><button class="btn" type="submit">Se connecter</button><p class="msg"></p><button class="link" type="button" style="background:none;border:0;color:var(--fg2);font:inherit;font-size:.8125rem;text-decoration:underline">Pas encore de mot de passe ? Recevoir un lien par mail</button></form></div>
<div id="setpw" hidden><form><img class="logo" src="icon-192.png?v=tnr" alt="TNR Athletics"><h1 style="margin:0;font-size:1.375rem">Choisis ton mot de passe</h1><p class="small muted" style="margin:0">Pour ouvrir l'appli sur n'importe quel navigateur avec <b class="who"></b>.</p><input name="password" type="password" autocomplete="new-password" placeholder="nouveau mot de passe"><button class="btn" type="submit">Enregistrer</button><p class="msg"></p><button class="later" type="button" style="background:none;border:0;color:var(--fg2);font:inherit;font-size:.8125rem">Plus tard</button></form></div><title>TNR Athletics</title>

<style>
/* Layout: iOS-style grouped list — centered header, recovery gauge hero, 2-column metric tiles that open a detail sheet with a scrubbable chart, translucent tab bar */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F2F2F6; --fg:#111114; --fg2:#6B6B73; --fg3:#A3A3AB;
  --line:rgba(60,60,67,.14); --accent:#2F7BF5; --accent-soft:rgba(47,123,245,.12); --orange:#D44A2A;
  --good:#22B04F; --warn:#E8900A; --bad:#EE3A2E; --blue:#2F7BF5; --violet:#8E6CF0; --teal:#1AA6B7;
  --bar:rgba(249,249,251,.8); --scrim:rgba(0,0,0,.32); --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
  --aura1:#7FB0FF; --aura2:#9ED8FF; --aura3:#A7B4FF; --aura-o:.6; --top:#B5CEFA;
  --font:system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --display:system-ui,-apple-system,"SF Pro Display","Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --card2:#2A2A2D; --fg:#F5F5F7; --fg2:#9C9CA4; --fg3:#5E5E66;
  --line:rgba(235,235,245,.12); --accent:#4C8FFF; --accent-soft:rgba(76,143,255,.18); --orange:#FF6A45;
  --good:#32D46A; --warn:#FFAE2E; --bad:#FF5147; --blue:#4C8FFF; --violet:#A68BFF; --teal:#3CC8D8;
  --bar:rgba(22,22,24,.8); --scrim:rgba(0,0,0,.55); --shadow:none; color-scheme:dark;
  --aura1:#1D4ED8; --aura2:#0369A1; --aura3:#3730A3; --aura-o:.5; --top:#0B1A40}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#2A2A2D; --fg:#F5F5F7; --fg2:#9C9CA4; --fg3:#5E5E66;
  --line:rgba(235,235,245,.12); --accent:#4C8FFF; --accent-soft:rgba(76,143,255,.18); --orange:#FF6A45;
  --good:#32D46A; --warn:#FFAE2E; --bad:#FF5147; --blue:#4C8FFF; --violet:#A68BFF; --teal:#3CC8D8;
  --bar:rgba(22,22,24,.8); --scrim:rgba(0,0,0,.55); --shadow:none; color-scheme:dark;
  --aura1:#1D4ED8; --aura2:#0369A1; --aura3:#3730A3; --aura-o:.5; --top:#0B1A40}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--font);-webkit-font-smoothing:antialiased}
/* No browser pull-down-to-reload at the top: refreshing is the pull up at the bottom of each page. */
html,body{overscroll-behavior-y:none}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(24px + env(safe-area-inset-top,0px)) var(--tbh,calc(64px + env(safe-area-inset-bottom,0px)))}
/* Page title block sits midway between the top of the screen and the first card: same space above and below. */
.top{text-align:center;margin:4px 0 28px}
.top .sub{color:var(--fg2);font-size:.9375rem}
.top .sub::first-letter{text-transform:uppercase}
h1{font:700 2.125rem/1.1 var(--display);letter-spacing:-.025em;margin:2px 0 0;text-wrap:balance}
h1.hello{font-size:1.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h2{font:600 1.25rem/1.2 var(--display);letter-spacing:-.015em;margin:28px 4px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font:400 .8125rem var(--font);color:var(--fg2);letter-spacing:0}
.eyebrow{font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2)}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--fg2)} .small{font-size:.8125rem}
.note{font-size:.8125rem;color:var(--fg2);padding:0 4px;margin:14px 0 0;text-align:center}
p{margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:14px;background:var(--accent);color:#fff;font-weight:600;font-size:1.0625rem;transition:transform .1s ease-out,opacity .1s}
.btn:disabled{opacity:.45;cursor:default}
.btn:active{transform:scale(.97);opacity:.9}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:.8125rem;font-weight:600;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.pill.none{color:var(--fg2);background:var(--card2)}

/* Recovery gauge */
.gauge{position:relative;width:min(280px,100%);margin:0 auto}
.gauge svg{width:100%;display:block;overflow:visible}
.gauge .center{position:absolute;left:0;right:0;bottom:2px;text-align:center}
.gauge .center b{display:block;font:700 3.25rem/1 var(--display);letter-spacing:-.04em}
.gauge .center b small{font-size:1.375rem;font-weight:600;letter-spacing:0}
.gauge .center span{font-size:.75rem;color:var(--fg2);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.gscale{display:flex;justify-content:space-between;width:min(300px,100%);margin:6px auto 0;font-size:.6875rem;color:var(--fg3);font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.hero{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.hero .state{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
.rings{display:grid;grid-template-columns:1fr 1.35fr 1fr;align-items:center;gap:6px;margin-top:4px}
.ringbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:0;transition:transform .12s ease-out}
.ringbtn:active{transform:scale(.96)}
.ringbtn svg.ring{width:100%;max-width:96px;display:block}
.ringbtn.main svg.ring{max-width:150px}
.ringbtn b{position:absolute;top:0;left:0;right:0;aspect-ratio:1;max-width:96px;margin:0 auto;display:flex;align-items:center;justify-content:center;font:600 1.25rem/1 var(--display);letter-spacing:-.02em}
.ringbtn.main b{max-width:150px;font-size:2.25rem;letter-spacing:-.035em}
.ringbtn b small{font-size:.55em;font-weight:600;margin-left:1px}
.ringbtn>span{font-size:.75rem;font-weight:600;color:var(--fg2);letter-spacing:.02em}
.target{background:var(--card2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.target b{font:600 1.0625rem var(--display)}
.target b span{font-weight:400;font-size:.875rem}
.effbar{display:flex;gap:3px;margin-top:4px}
.effbar span{height:22px;border-radius:6px;background:var(--line);font-size:.625rem;font-weight:600;color:var(--fg2);display:flex;align-items:center;justify-content:center;letter-spacing:.02em}
.effbar span.on{background:var(--blue);color:#fff}
/* Discreet 0-21 ruler under the effort bands: one thin line, a tick and its number where each band starts. */
.effscale{display:flex;gap:3px;position:relative;height:15px;margin-top:5px;border-top:1px solid color-mix(in srgb,var(--fg3) 75%,transparent)}
.effscale .you{position:absolute;top:-4px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;font:700 .625rem/1 var(--font);color:var(--blue);font-variant-numeric:tabular-nums;transition:left .6s cubic-bezier(.32,.72,0,1)}
.effscale .you s{display:block;width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 2px var(--card2)}
.effscale span{position:relative}
.effscale span::before,.effscale::after{content:"";position:absolute;top:-1px;width:1px;height:5px;background:var(--fg3)}
.effscale span::before{left:0}
.effscale::after{right:0}
.effscale i,.effscale em{position:absolute;top:5px;font:500 .5625rem/1 var(--font);color:var(--fg2);font-style:normal;font-variant-numeric:tabular-nums}
.effscale i{left:0;transform:translateX(-50%)}
.effscale span:first-child i{transform:none}
.effscale em{right:0}
.hero .summary{font-size:1rem;line-height:1.55;text-align:center;text-wrap:pretty}
.dials{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dial{display:flex;align-items:center;gap:12px;background:var(--card2);border-radius:16px;padding:10px 12px;text-align:left;width:100%}
.dial svg{width:46px;height:46px;flex:none;transform:rotate(-90deg)}
.dial b{display:block;font:600 1.25rem/1.1 var(--display);letter-spacing:-.02em}
.dial span{font-size:.75rem;color:var(--fg2)}
.todo{border-top:1px solid var(--line);padding-top:12px}
.todo ul{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.todo li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:.9375rem}
.todo li b{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:.75rem}

/* Tiles */
.tile{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column;gap:4px;text-align:left;width:100%;transition:transform .12s ease-out}
.tile:active{transform:scale(.97)}
.tile .lab{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:.8125rem;font-weight:600;color:var(--c)}
.tile .lab span{display:flex;align-items:center;gap:6px;min-width:0}
.tile .lab svg{width:15px;height:15px;flex:none}
.tile .lab .chev{width:12px;height:12px;color:var(--fg3)}
.tile .big{font:600 1.625rem/1.1 var(--display);letter-spacing:-.02em;margin-top:4px}
.tile .big small{font-size:.875rem;font-weight:500;color:var(--fg2);margin-left:3px;letter-spacing:0}
.tile .sub2{font-size:.75rem;color:var(--fg2);min-height:1.1em}
.tile .sub2 .up{color:var(--good)} .tile .sub2 .down{color:var(--bad)}
.range{position:relative;height:6px;border-radius:99px;background:var(--card2);margin:10px 0 4px}
.range .zone{position:absolute;top:0;bottom:0;border-radius:99px;background:color-mix(in srgb,var(--good) 35%,transparent)}
.range i{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--cur,var(--fg));border:3px solid var(--card);box-shadow:0 1px 4px rgba(0,0,0,.25);transform:translate(-50%,-50%)}
.rlab{display:flex;justify-content:space-between;font-size:.625rem;color:var(--fg3);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.tile svg.mini{width:100%;height:30px;display:block;margin-top:8px}

/* Sessions */
.sess{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:12px 16px;width:100%;text-align:left}
.sess+.sess{border-top:1px solid var(--line)}
.sess .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent)}
.sess .ic svg{width:20px;height:20px}
.sess b{display:block;font-weight:600;font-size:.9375rem}
.sess .meta{font-size:.8125rem;color:var(--fg2)}
.sess .eff{font:600 .9375rem var(--display);padding:5px 10px;border-radius:99px;background:var(--card2);font-variant-numeric:tabular-nums}

/* Charts */
.chartbox{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:crosshair}
.chart{width:100%;display:block;overflow:visible}
.chart text{fill:var(--fg2);font:10px var(--font)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .scrub{stroke:var(--fg2);stroke-width:1;stroke-dasharray:3 3}
.bubble{position:absolute;top:-6px;transform:translate(-50%,-100%);background:var(--fg);color:var(--bg);border-radius:10px;padding:5px 9px;font-size:.75rem;line-height:1.3;white-space:nowrap;pointer-events:none;text-align:center;font-variant-numeric:tabular-nums}
.bubble b{font-size:.875rem}
.bubble em{font-style:normal;display:block;font-size:.6875rem;opacity:.75}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:34px}
.chead b{font:600 1.375rem/1 var(--display);letter-spacing:-.02em}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--fg2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;padding:7px 10px;border-radius:8px;font-size:.8125rem;font-weight:600;color:var(--fg2);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Detail */
.dhead{text-align:center;padding:18px 0 6px}
.dhead .big{font:700 2.75rem/1 var(--display);letter-spacing:-.03em;margin-top:4px}
.dhead .big small{font-size:1.125rem;font-weight:500;color:var(--fg2);margin-left:4px;letter-spacing:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--card2);border-radius:12px;padding:8px 4px}
.stats b{display:block;font:600 1rem var(--display);font-variant-numeric:tabular-nums}
.stats span{font-size:.6875rem;color:var(--fg2)}
.why{font-size:.9375rem;line-height:1.5}
.sci{font-size:.8125rem;line-height:1.5;color:var(--fg2)}

/* Reports */
.rep h3{font:600 1.125rem/1.25 var(--display);margin:8px 0 4px;letter-spacing:-.01em}
.rep section{margin-top:14px}
.rep ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.rep p{margin-top:6px}
.tag{font-size:.75rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.tag.good{color:var(--good)} .tag.warn{color:var(--warn)} .tag.bad{color:var(--bad)} .tag.acc{color:var(--accent)}

/* Timeline */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:18px 1fr;gap:12px;padding-bottom:16px;position:relative}
.tl li::after{content:"";position:absolute;left:8px;top:22px;bottom:2px;width:2px;background:var(--line)}
.tl li:last-child{padding-bottom:0} .tl li:last-child::after{display:none}
.tl .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--fg3);background:var(--card);margin-top:2px}
.tl li.done .dot{background:var(--good);border-color:var(--good)}
.tl li.now .dot{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tl b{display:block;font-weight:600}

/* Lists / form */
.list{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;min-height:50px}
.row+.row{border-top:1px solid var(--line)}
.row label,.row .l{flex:1;min-width:0}
.proto details{display:block}
.proto details+details{border-top:1px solid var(--line)}
.proto summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
.proto summary::-webkit-details-marker{display:none}
.proto summary::after{content:"›";color:var(--fg3);font-size:1.25rem;transition:transform .2s}
.proto details[open] summary::after{transform:rotate(90deg)}
.proto ul{margin:10px 0 2px;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.875rem;color:var(--fg2)}
.row .hint{display:block;font-size:.75rem;color:var(--fg2)}
.row input[type=date],.row input[type=number]{font:inherit;color:var(--fg);background:var(--card2);border:0;border-radius:10px;padding:8px 10px;width:110px;text-align:right;font-variant-numeric:tabular-nums}
.row.col{flex-direction:column;align-items:stretch;gap:8px}
.rangeline{display:flex;align-items:center;gap:12px}
.rangeline output{width:52px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{flex:1;accent-color:var(--accent);height:28px}
textarea{width:100%;font:inherit;color:var(--fg);background:var(--card2);border:0;border-radius:12px;padding:10px 12px;resize:vertical}
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch input{z-index:1}
.switch span{position:absolute;inset:0;pointer-events:none;border-radius:99px;background:var(--fg3);transition:background .2s}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.switch input:checked+span{background:var(--good)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
/* Background identity: Sprint Lab is the blue app (nutrition will be green, training red). Large, very soft blue glows drift slowly behind the cards. */
.aura{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aura span{position:absolute;border-radius:50%;filter:blur(80px);opacity:var(--aura-o);will-change:transform}
.aura span:nth-child(1){width:70vmax;height:70vmax;left:-35vmax;top:-20vmax;background:var(--aura1);animation:drift1 38s ease-in-out infinite alternate}
.aura span:nth-child(2){width:60vmax;height:60vmax;right:-32vmax;top:25vh;background:var(--aura2);animation:drift2 46s ease-in-out infinite alternate}
.aura span:nth-child(3){width:55vmax;height:55vmax;left:-25vmax;bottom:-30vmax;background:var(--aura3);animation:drift3 52s ease-in-out infinite alternate}
.aura span:nth-child(4){width:40vmax;height:40vmax;right:-20vmax;bottom:-15vmax;background:var(--aura1);animation:drift2 60s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(12vmax,10vmax) scale(1.1)}}
@keyframes drift2{to{transform:translate(-14vmax,-8vmax) scale(.92)}}
@keyframes drift3{to{transform:translate(10vmax,-12vmax) scale(1.08)}}
.wrap{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){.aura span{animation:none}}
.aura.still span{animation:none}
.grid>:last-child:nth-child(odd){grid-column:1/-1}
.foot{margin-top:24px}
.srcs{display:flex;justify-content:center;gap:16px;font-size:.75rem;color:var(--fg2);font-variant-numeric:tabular-nums}
.srcs span{display:flex;align-items:center;gap:6px}
.srcs i{width:8px;height:8px;border-radius:50%}

body::before{content:"";position:fixed;inset:0 0 auto;height:calc(env(safe-area-inset-top,0px) + 24px);z-index:55;pointer-events:none;background:linear-gradient(to bottom,var(--top) env(safe-area-inset-top,0px),color-mix(in srgb,var(--top) 55%,transparent) calc(env(safe-area-inset-top,0px) + 10px),transparent)}

.exl{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}

.exl li span:last-child{color:var(--fg2);font-variant-numeric:tabular-nums;white-space:nowrap}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week span{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border-radius:14px;font-size:.6875rem;color:var(--fg2);font-weight:600}
.week span.today{background:var(--accent-soft);color:var(--accent)}
.week i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 .75rem var(--display);font-style:normal;color:var(--fg);border:2px solid var(--line)}
.week i.plan{border-color:var(--accent)}
.week i.done{background:var(--accent);border-color:var(--accent);color:#fff}
.rowbtn{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:12px 16px;text-align:left;min-height:56px}
.rowbtn+.rowbtn{border-top:1px solid var(--line)}
.rowbtn b{display:block;font-weight:600;font-size:.9375rem}
.rowbtn .meta{display:block;font-size:.8125rem;color:var(--fg2)}
.rowbtn>svg{width:12px;height:12px;color:var(--fg3);flex:none}
.rowbtn .kc{font:600 .9375rem var(--display);color:var(--fg2);font-variant-numeric:tabular-nums;white-space:nowrap}
.search{width:100%;font:inherit;color:var(--fg);background:var(--card2);border:0;border-radius:12px;padding:11px 14px}
.chipsx{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none;margin:10px 0}
.chipsx::-webkit-scrollbar{display:none}
.chipsx .chip{flex:none}
.addbtn{display:flex;align-items:center;gap:8px;width:100%;padding:12px 16px;color:var(--accent);font-weight:600;font-size:.9375rem;text-align:left}
.addbtn+.rowbtn,.rowbtn+.addbtn{border-top:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,.mini-in{font:inherit;color:var(--fg);background:var(--card2);border:0;border-radius:10px;padding:9px 10px;width:100%}
.mini-in{text-align:center;font-weight:600;font-variant-numeric:tabular-nums;padding:8px 4px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pane header .save,.pane header .close{color:var(--accent)}
.pane{z-index:52}
/* Live session */
.livehead{display:flex;justify-content:space-between;align-items:center;margin:16px 0 4px}
.livehead b{font:700 1.5rem var(--display);font-variant-numeric:tabular-nums}
.exbox{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow);margin-top:12px}
.exbox h3{font:600 1.0625rem/1.25 var(--display);margin:0;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.exbox h3 small{font:500 .75rem var(--font);color:var(--fg2);white-space:nowrap}
.exbox .hint{font-size:.75rem;color:var(--fg2);margin-top:2px}
.exbox .sug{font-size:.75rem;color:var(--accent);font-weight:600;margin-top:4px}
.sets{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.setrow{display:grid;grid-template-columns:22px 1fr 1fr 1fr 40px;gap:6px;align-items:center}
.setrow.hd{font-size:.625rem;color:var(--fg3);text-transform:uppercase;letter-spacing:.05em;font-weight:600;text-align:center}
.setrow .n{font-weight:700;color:var(--fg2);font-size:.8125rem;text-align:center}
.setrow .prev,.setrow .spd{font-size:.75rem;color:var(--fg3);text-align:center;font-variant-numeric:tabular-nums}
.setrow .ok{width:40px;height:38px;border-radius:12px;background:var(--card2);display:grid;place-items:center;color:var(--fg3)}
.setrow .ok svg{width:20px;height:20px}
.setrow.done .ok{background:var(--accent);color:#fff}
.setrow.done .mini-in{background:var(--accent-soft)}
.exbox .tools{display:flex;gap:8px;margin-top:8px}
.exbox .tools button{font-size:.8125rem;font-weight:600;color:var(--accent);padding:6px 0}
.exbox .tools button.rm{color:var(--fg3);margin-left:auto}
.rest{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;border-radius:99px;background:var(--fg);color:var(--bg);font:600 .9375rem var(--display);box-shadow:0 10px 30px rgba(0,0,0,.25);font-variant-numeric:tabular-nums}
.rest b{min-width:44px}
.rest button{white-space:nowrap;padding:7px 11px;border-radius:99px;background:color-mix(in srgb,var(--bg) 20%,transparent);color:var(--bg);font-size:.8125rem;font-weight:600}
.edrow{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-top:8px}
.edrow label{display:flex;flex-direction:column;gap:3px;font-size:.625rem;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em;font-weight:600;text-align:center}
/* Fuel */
.calring{display:grid;grid-template-columns:128px 1fr;gap:18px;align-items:center}
.calring .rw{position:relative}
.calring .rw svg.ring{width:100%;display:block}
.calring .rw b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 1.625rem/1 var(--display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.calring .rw b small{font:600 .625rem/1.4 var(--font);color:var(--fg2);letter-spacing:.04em;text-transform:uppercase;margin-top:4px}
.calrows{display:flex;flex-direction:column;gap:8px;font-size:.875rem}
.calrows div{display:flex;justify-content:space-between;gap:8px}
.calrows b{font-variant-numeric:tabular-nums}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.macro{display:flex;flex-direction:column;gap:5px;font-size:.75rem}
.macro span{color:var(--fg2);font-weight:600}
.macro b{font:600 .9375rem var(--display);font-variant-numeric:tabular-nums}
.macro b small{font:500 .75rem var(--font);color:var(--fg2)}
.macro .bar{height:6px;border-radius:99px;background:var(--card2);overflow:hidden}
.macro .bar i{display:block;height:100%;border-radius:99px;background:var(--mc)}
.meal{padding:0}
.meal>h3{display:flex;justify-content:space-between;align-items:baseline;font:600 1.0625rem var(--display);margin:0;padding:14px 16px 4px}
.meal>h3 small{font:500 .8125rem var(--font);color:var(--fg2);font-variant-numeric:tabular-nums}
.water{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.water button{width:30px;height:38px;border-radius:6px 6px 11px 11px;border:2px solid var(--line);transition:background .15s,border-color .15s}
.water button.on{background:#4FB3FF;border-color:#4FB3FF}
.daynav{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;text-align:center}
.daynav button{height:36px;border-radius:10px;font-size:1.375rem;line-height:1;color:var(--accent)}
.daynav button:disabled{color:var(--fg3)}
.daynav b{font:600 .9375rem var(--display)}
.fres{margin-top:10px}
.qty{display:flex;align-items:center;gap:10px;margin-top:12px}
.qty input{flex:1;font:700 1.75rem var(--display);text-align:center;color:var(--fg);background:var(--card2);border:0;border-radius:14px;padding:10px;font-variant-numeric:tabular-nums}
.qty span{font-weight:600;color:var(--fg2)}

<script>const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key = d => { const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
const addDays = (k, n) => { const d = new Date(k + 'T12:00:00'); d.setDate(d.getDate() + n); return key(d); };
const fmtDay = k => new Date(k + 'T12:00:00').toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
const fmtShort = k => new Date(k + 'T12:00:00').toLocaleDateString('fr-FR', {weekday:'short', day:'numeric', month:'short'});
const short = k => { const [, m, d] = k.split('-'); return d + '/' + m; };
const fx = (v, n = 0) => v == null || isNaN(v) ? '–' : Number(v).toLocaleString('fr-FR', {minimumFractionDigits:n, maximumFractionDigits:n});
const hmH = h => h == null ? '–' : `${Math.floor(h)} h ${String(Math.round(h % 1 * 60)).padStart(2, '0')}`;
const pct = (v, ref) => v == null || !ref ? null : (v - ref) / ref * 100;
const sgn = p => p == null ? '' : Math.abs(p) < .5 ? 'stable' : (p >= 0 ? '+' : '−') + fx(Math.abs(p)) + ' %';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const TODAY = key(new Date());
const SLEEP_NEED = 8.5;

const S = { db: null, g: {}, w: {}, manual: {}, analysis: null, reports: [], profile: null, hrMax: 195, tab: 'today', gran: 'week', off: 0, status: 'loading', sheet: null };
// Season weeks run Monday to Sunday; week 1 is the week of 31 August 2026 unless the profile says otherwise.
function seasonWeek(k) { const s = S.profile?.seasonStart || '2026-08-31'; return Math.floor((new Date(k + 'T12:00:00') - new Date(s + 'T12:00:00')) / 6048e5) + 1; }
const GYM_RE = /strength|fitness_equipment|hiit|cardio_training|training/;
function gymAct(k) { return (G(k, 'acts') || []).find(a => GYM_RE.test(a.type)); }
function trackAct(k) { return (G(k, 'acts') || []).find(a => /track/.test(a.type) || (/running/.test(a.type) && (a.start || '') >= '16:00')); }

/* ---------- metrics ---------- */
const G = (k, f) => S.g[k]?.[f];
const W = (k, f) => S.w[k]?.[f];
const M = (k, f) => S.manual[k]?.[f];
const VAL = {
  hrv: k => G(k, 'hrv'), rhr: k => G(k, 'rhr'), resp: k => G(k, 'resp'),
  sleepH: k => G(k, 'sleepS') != null && G(k, 'sleepS') > 7200 ? G(k, 'sleepS') / 3600 : null,
  sleepPerf: k => VAL.sleepH(k) != null ? clamp(VAL.sleepH(k) / SLEEP_NEED * 100, 0, 100) : null,
  effort: k => effortDay(k) || null,
  weight: k => W(k, 'weight'), fat: k => W(k, 'fatPct'), muscle: k => W(k, 'muscleKg'),
  // VO2max estimated from raw heart rates (Uth et al. 2004): 15,3 × FC max / FC repos (7-day mean). Garmin's own estimate is kept apart for comparison.
  vo2: k => { const r = avgN('rhr', 7, k); return r ? 15.3 * S.hrMax / r : null; },
  pwv: k => W(k, 'pwv'),
  physio: k => physioAge(k)?.age ?? null,
  // Normalised fat-free mass index (Kouri 1995): lean mass / height², adjusted to a 1,80 m reference.
  ffmi: k => { const h = (S.profile?.height || 0) / 100, w = W(k, 'weight'), f = W(k, 'fatKg'); return h > 1 && w && f != null ? (w - f) / h / h + 6.1 * (1.8 - h) : null; },
  bikeKm: k => G(k, 'bikeKm') || null, runKm: k => runKm(k) || null,
  sprint: k => M(k, 'sprintM') || null, pain: k => maxPain(k),
  recovery: k => recovery(k)?.score ?? null
};
function series(f, n, end = TODAY) { const out = []; for (let i = n - 1; i >= 0; i--) { const k = addDays(end, -i); const v = VAL[f](k); out.push({k, v: v == null ? null : +v}); } return out; }
function base(f, end = TODAY, n = 28) {
  const v = series(f, n, addDays(end, -1)).map(p => p.v).filter(x => x != null);
  if (v.length < 7) return null;
  const m = mean(v), sd = Math.sqrt(mean(v.map(x => (x - m) ** 2))) || 1;
  return {m, sd, n: v.length};
}
function avgN(f, n = 7, end = TODAY) { return mean(series(f, n, end).map(p => p.v).filter(v => v != null)); }
function sumN(f, n = 7, end = TODAY) { return series(f, n, end).reduce((s, p) => s + (p.v || 0), 0); }
function lastKey(f) { for (let i = 0; i < 10; i++) { const k = addDays(TODAY, -i); if (VAL[f](k) != null) return k; } return null; }
// Days imported from the history only carry daily totals (runKm, trimp), not the session list.
function runKm(k) { const acts = G(k, 'acts'); return acts ? acts.filter(a => /running|track/.test(a.type)).reduce((s, a) => s + (a.km || 0), 0) : (G(k, 'runKm') || 0); }
let REST = null;
function restHr() { return REST ??= base('rhr', TODAY, 60)?.m ?? 50; }
function trimpOf(a) {
  if (!a.avgHr || !a.min) return 0;
  const r = restHr(), x = clamp((a.avgHr - r) / (S.hrMax - r), 0, 1);
  return a.min * x * 0.64 * Math.exp(1.92 * x);
}
// Daily load = cardio TRIMP from the watch + session-RPE (Foster) for sessions done without it, scaled to TRIMP units.
// When the watch recorded the gym or track session and an RPE is noted, the RPE replaces that session's heart-rate load
// (HR underestimates strength and sprint work) and the watch supplies the duration.
function loadDay(k) {
  const acts = G(k, 'acts') || [], gA = gymAct(k), tA = trackAct(k);
  const gR = M(k, 'gymRpe'), tR = M(k, 'trackRpe');
  let L = G(k, 'acts') ? acts.reduce((s, a) => s + ((a === gA && gR) || (a === tA && tR) ? 0 : trimpOf(a)), 0) : (G(k, 'trimp') || 0);
  if (gR) L += gR * (M(k, 'gymMin') || gA?.min || 90) / 4;
  if (tR) L += tR * (M(k, 'trackMin') || tA?.min || 75) / 4;
  return L;
}
// Effort on a 0-21 scale, logarithmic like cardiovascular strain: doubling the load does not double the score.
const toEffort = L => L > 0 ? clamp(21 * Math.log(1 + L / 3) / Math.log(1 + 700 / 3), 0, 21) : 0;
function effortDay(k) { return toEffort(loadDay(k)); }
function zOf(v, b) { return v == null || !b ? null : (v - b.m) / b.sd; }
const sig = z => clamp(.5 + z / 4, 0, 1);
// Recovery 0-100: HRV (today + 7-day mean, Plews) vs 60-day baseline, resting HR, sleep vs need, respiratory rate as an illness flag.
function recovery(k) {
  const hrv = G(k, 'hrv'); if (hrv == null) return null;
  const bH = base('hrv', k, 60), bR = base('rhr', k, 60), bResp = base('resp', k, 60);
  if (!bH) return null;
  const h7 = avgN('hrv', 7, k);
  const zH = .5 * zOf(hrv, bH) + .5 * zOf(h7, bH);
  const zR = G(k, 'rhr') != null && bR ? zOf(G(k, 'rhr'), bR) : 0;

  let s = 100 * (.45 * sig(zH) + .2 * sig(-zR) + .35 * sp);
  const ill = bResp && G(k, 'resp') != null && G(k, 'resp') - bResp.m > 1 || (G(k, 'skinTempC') ?? 0) > 1;
  if (ill) s -= 15;
  if ((maxPain(k) ?? 0) >= 3) s = Math.min(s, 33);

/* ---------- reference values: age-matched norms and physiological age ---------- */
function ageOf(k = TODAY) { const b = S.profile?.birthDate; if (!b) return S.profile?.birthYear ? +k.slice(0, 4) - S.profile.birthYear : null; const d = new Date(k + 'T12:00:00'), x = new Date(b + 'T12:00:00'); return d.getFullYear() - x.getFullYear() - (d < new Date(d.getFullYear(), x.getMonth(), x.getDate()) ? 1 : 0); }
const lerpAge = (tbl, a) => { a = clamp(a, tbl[0][0], tbl.at(-1)[0]); for (let i = 1; i < tbl.length; i++) if (a <= tbl[i][0]) { const [a0, v0] = tbl[i - 1], [a1, v1] = tbl[i]; return v0 + (v1 - v0) * (a - a0) / (a1 - a0); } return tbl.at(-1)[1]; };
// VO2max 50th percentile, men, treadmill (FRIEND registry, Kaminsky 2015), at decade mid-points.
const VO2_NORM = [[25, 48.0], [35, 42.4], [45, 37.8], [55, 32.6], [65, 28.2]];
// Pulse wave velocity in healthy men with optimal blood pressure (Reference Values for Arterial Stiffness Collaboration, 2010).
const PWV_NORM = [[25, 6.1], [35, 6.4], [45, 6.7], [55, 7.6], [65, 9.1], [75, 10.4]];
// Age at which the norm equals the value; below the first decade the trend is extended, floored at 16.
function ageFor(tbl, v, decreasing) {
  const [a0, v0] = tbl[0], [a1, v1] = tbl[1], slope = (v1 - v0) / (a1 - a0);
  if (decreasing ? v >= v0 : v <= v0) return Math.max(16, a0 + (v - v0) / slope);
  for (let i = 1; i < tbl.length; i++) { const [b0, w0] = tbl[i - 1], [b1, w1] = tbl[i]; if (decreasing ? v >= w1 : v <= w1) return b0 + (v - w0) / (w1 - w0) * (b1 - b0); }
  return tbl.at(-1)[0];
}
// Physiological age = mean of the cardiorespiratory age (VO2max) and the vascular age (PWV), each from raw measurements.
function physioAge(k) {
  const vo2 = VAL.vo2(k), pw = avgOfRange('pwv', addDays(k, -59), k);
  const parts = [];
  if (vo2) parts.push(['cardio', ageFor(VO2_NORM, vo2, true)]);
  if (pw) parts.push(['vasculaire', ageFor(PWV_NORM, pw, false)]);
  return parts.length ? {age: mean(parts.map(p => p[1])), parts, withings: lastVal('metaAge', k)} : null;
}
function avgOfRange(f, from, to) { const v = []; for (let k = from; k <= to; k = addDays(k, 1)) { const x = VAL[f]?.(k) ?? W(k, f); if (x != null) v.push(+x); } return v.length ? mean(v) : null; }
function lastVal(f, k) { for (let i = 0; i < 60; i++) { const x = W(addDays(k, -i), f); if (x != null) return x; } return null; }
// Men of the same age. Only metrics where a comparison means something.
function POP(id) {
  const a = ageOf() ?? 25;

    rhr: {mean: 70, lo: 45, hi: 90, txt: 'Hommes 20-39 ans : moyenne ≈ 70 bpm (NHANES). Sportifs d\'endurance : 40 à 55.', better: 'low'},
    hrv: {mean: a < 30 ? 55 : 45, lo: 20, hi: 120, txt: `VFC nocturne des hommes de ${a < 30 ? '20-29' : '30-39'} ans : moyenne ≈ ${a < 30 ? 55 : 45} ms (données de montres, valeur indicative).`, better: 'high'},
    sleepH: {mean: 7, lo: 5, hi: 10, txt: 'Jeunes adultes : 7 h en moyenne mesurées par montre. Recommandé aux athlètes : 8 à 10 h.', better: 'high'},
    vo2: {mean: lerpAge(VO2_NORM, a), lo: 30, hi: 70, txt: `Hommes de ${a} ans : médiane ≈ ${fx(lerpAge(VO2_NORM, a))} ml/kg/min (registre FRIEND). Sprinteurs : souvent 50 à 58.`, better: 'high'},
    pwv: {mean: lerpAge(PWV_NORM, a), lo: 4, hi: 10, txt: `Hommes de ${a} ans en bonne santé : ≈ ${fx(lerpAge(PWV_NORM, a), 1)} m/s. Plus bas = artères plus souples.`, better: 'low'},
    ffmi: {mean: 19.5, lo: 16, hi: 26, txt: 'Hommes non entraînés : ≈ 19,5 (Kouri 1995). Athlétique : 21 à 22. Sprinteurs de haut niveau : 22 à 24.', better: 'high'}

}
function popBlock(id, v) {

async function refreshAll(silent = false) {
  if (ptr.busy) return;
  if (!S.db) { if (!silent) toast('Ouvre la page connecté à ton compte'); return; }
  ptr.busy = true; ptr.silent = silent;
  if (!silent) {
    const el = ptrEl(); if (el) el.classList.add('busy');
    // Once its space has opened (.35 s), the page slides up so the wheel turns just above the tab bar.
    setTimeout(() => {
      const y0 = scrollY, t0 = performance.now();
      const step = now => { const k = Math.min(1, (now - t0) / 250), end = document.documentElement.scrollHeight - innerHeight; window.scrollTo(0, y0 + (end - y0) * (1 - (1 - k) ** 3)); if (k < 1) requestAnimationFrame(step); };

    }, 380);
  }

  // Either way the request is left so the cloud sync also refreshes the advice.
  let msg = 'Demande envoyée · Garmin et Withings relus dans l\'heure', failed = false;
  try {
    await S.db.doc('requests/sync').set({requestedAt: new Date().toISOString()});
    if (window.RECUP_SYNC) msg = await Promise.race([window.RECUP_SYNC(), new Promise(r => setTimeout(() => r('Connexion lente : réessaie dans un instant'), 20000))]);
    await Promise.all([...['garmin', 'withings', 'manual', 'reports'].map(c => S.db.collection(c).get()), S.db.doc('analysis/latest').get(), S.db.doc('profile/main').get(), S.db.doc('status/sync').get()]);

  // What the browser's pull-to-reload used to do: pick up a new version of the app, if there is one.

  REST = null;
  setTimeout(() => {
    // The wheel drops down and its space folds away; only a failure is said, and only when asked by hand.
    const el = ptrEl(); if (el) el.classList.add('done');
    setTimeout(() => { ptr.busy = false; ptr.silent = false; ptrEl()?.classList.remove('busy'); setTimeout(render, 400); }, 250);
    if (failed && !silent) toast('Actualisation impossible, vérifie ta connexion');
  }, 200);
}

function tProgress() {

function defaultItem(id) {

/* ---------- live session ---------- */
function startSession(id) {
  if (S.live) { toast('Une séance est déjà en cours : termine-la d\'abord'); openLive(); return; }
  const p = planById(id); if (!p) return;
  S.live = {id: uid(), plan: p.id, name: p.name, kind: p.kind, date: TODAY, start: new Date().toISOString(), items: p.items.map(liveItem)};
  saveLive(); closeAllPanes(); openLive();
}
function liveItem(it) {
  const e = exOf(it.ex);
  if (e.t === 'track') return {ex: it.ex, tg: it, reps: Array.from({length: it.min ? 1 : it.reps || 1}, () => ({dist: it.dist || '', t: '', done: false}))};
  const sg = suggest(it);
  return {ex: it.ex, tg: it, u: unitOf(it), sets: Array.from({length: it.sets || 1}, () => ({kg: sg ? sg.kg : '', reps: it.reps || '', done: false}))};
}
// A training session the watch sent to Garmin today (strength for a gym plan, running for a track plan).
function watchSession(k, p) {
  const want = p?.kind === 'track' ? ['track_running', 'running'] : p?.kind === 'gym' ? ['strength_training'] : ['strength_training', 'track_running'];
  return (G(k, 'acts') || []).filter(a => want.includes(a.type) && (a.min || 0) >= 10).sort((a, b) => (b.start || '').localeCompare(a.start || ''))[0] || null;
}
// After the watch: the planned session, already filled in as planned and ticked, to correct.
function fillFromWatch(start) {
  const p = planFor(TODAY), a = watchSession(TODAY, p); if (!a) return;
  const items = (p ? p.items : []).map(liveItem);
  for (const it of items) for (const x of it.sets || it.reps) x.done = true;
  S.live = {id: uid(), plan: p?.id || null, name: p?.name || a.name || (ACT[a.type] || ['Séance'])[0], kind: p?.kind || (a.type === 'strength_training' ? 'gym' : 'track'),
    date: TODAY, start: new Date().toISOString(), items, fill: !!p, garmin: {min: a.min, start: a.start, avgHr: a.avgHr || null}};
  saveLive(); openLive();
}
function openLive() { if (!S.live) return; openPane({title: S.live.name, live: true, left: {label: 'Terminer', fn: finishPane}, render: liveBody}); }
function liveBody() {
  const L = S.live; if (!L) return '<div class="empty">Séance terminée.</div>';
  const gA = L.garmin;
  const doneSets = L.items.reduce((s, it) => s + (it.sets || it.reps).filter(x => x.done).length, 0), all = L.items.reduce((s, it) => s + (it.sets || it.reps).length, 0);
  const back = (L.removed || []).map((r, n) => `<button data-tlback="${n}" aria-label="Remettre ${esc(exOf(r.item.ex).n)} dans la séance"><b>${esc(exOf(r.item.ex).n)}</b> · retiré · toucher pour remettre</button>`).join('');
  return `<div class="livehead"><span class="chiptag">${L.kind === 'gym' ? 'Musculation' : 'Piste'} · ${doneSets}/${all}</span>${gA ? `<b>${fx(gA.min)} min</b>` : ''}</div>
    ${L.fill ? `<p class="small muted" style="margin:10px 4px 0">Tout est rempli comme prévu. Corrige ce qui a changé et décoche ce que tu n'as pas fait.</p>` : ''}
    ${L.items.map((it, i) => liveBox(it, i)).join('')}
    ${back ? `<div class="rmback">${back}</div>` : ''}
    <div class="stack" style="margin-top:14px"><button class="btn ghost" data-tladd>+ Ajouter un exercice</button><button class="btn" data-tfinish>Terminer la séance</button>
    <button class="small muted" data-tcancel style="padding:10px">Abandonner sans enregistrer</button></div>`;
}
function liveBox(it, i) {
  const e = exOf(it.ex), tg = it.tg || {}, last = lastText(it.ex), sg = it.sets ? suggest(tg) : null;
  const ok = (a, done) => `<button class="ok" data-tok="${a}" aria-label="Valider" aria-pressed="${done}">${TICK}</button>`;
  let rows;
  if (it.reps) {
    const timed = e.u === 'm';
    rows = (e.u === 'min' ? '' : `<div class="setrow hd"><span>#</span><span>Distance</span><span>${timed ? 'Temps' : ''}</span><span>${timed ? 'Vitesse' : ''}</span><span></span></div>`) + it.reps.map((r, j) => {
      const v = +r.t > 0 && +r.dist > 0 ? fx(r.dist / r.t * 3.6, 1) + ' km/h' : '';
      return e.u === 'min' ? `<div class="setrow ${r.done ? 'done' : ''}"><span class="n">${j + 1}</span><span class="small" style="grid-column:span 3">${tg.min || ''} min</span>${ok(i + '.' + j, r.done)}</div>`
        : `<div class="setrow ${r.done ? 'done' : ''}"><span class="n">${j + 1}</span><input class="mini-in" inputmode="numeric" data-lv="${i}.${j}.dist" value="${r.dist}" placeholder="m" aria-label="Distance">${timed ? `<input class="mini-in" inputmode="decimal" data-lv="${i}.${j}.t" value="${r.t}" placeholder="s" aria-label="Temps en secondes">` : '<span></span>'}<span class="spd">${v}</span>${ok(i + '.' + j, r.done)}</div>`;
    }).join('');
  } else {
    const prev = exHistory(it.ex)[0]?.it.sets || [];
    rows = `<div class="seg useg" role="group" aria-label="Compter en">${[['reps', 'Répétitions'], ['s', 'Secondes']].map(([v, l]) => `<button type="button" data-tlu="${i}.${v}" aria-pressed="${unitOf(it) === v}">${l}</button>`).join('')}</div><div class="setrow hd"><span>#</span><span>Avant</span><span>${e.u === 'kg' ? 'kg' : e.u === 's' ? '' : '+ kg'}</span><span>${unitOf(it) === 's' ? 'Secondes' : 'Répét.'}</span><span></span></div>` + it.sets.map((s, j) => `<div class="setrow ${s.done ? 'done' : ''}"><span class="n">${j + 1}</span><span class="prev">${prev[j] ? (prev[j].kg ? fx(prev[j].kg, prev[j].kg % 1 ? 1 : 0) + '×' : '') + prev[j].reps : '–'}</span>${e.u === 's' ? '<span></span>' : `<input class="mini-in" inputmode="decimal" data-lv="${i}.${j}.kg" value="${s.kg}" placeholder="${e.u === 'kg' ? 'kg' : '0'}" aria-label="Charge">`}<input class="mini-in" inputmode="numeric" data-lv="${i}.${j}.reps" value="${s.reps}" placeholder="${tg.reps || ''}" aria-label="${unitOf(it) === 's' ? 'Secondes' : 'Répétitions'}">${ok(i + '.' + j, s.done)}</div>`).join('');
  }
  return `<div class="exbox"><h3>${esc(e.n)}<small>${itemText(tg.ex ? {...tg, u: it.u} : {ex: it.ex, sets: it.sets?.length, reps: '', min: 0})}</small></h3>
    ${last ? `<div class="hint">${esc(last)}</div>` : ''}${sg ? `<div class="sug">Proposé : ${fx(sg.kg, sg.kg % 1 ? 1 : 0)} kg · ${esc(sg.why)}</div>` : ''}
    <div class="sets">${rows}</div>
    <div class="tools"><button data-tlset="${i}">+ Série</button><button data-tex="${it.ex}">Consignes</button><button class="rm" data-tlrm="${i}">Retirer</button></div></div>`;
}
let RT = {t: null, end: 0};
// No rest timer: the watch times the rests.
function stopRest() { clearInterval(RT.t); }
function finishPane() {
  const L = S.live; if (!L) return;
  if (!L.garmin) { const a = watchSession(L.date, {kind: L.kind}); if (a) L.garmin = {min: a.min, start: a.start, avgHr: a.avgHr || null}; }
  const min = L.garmin?.min ? Math.round(L.garmin.min) : Math.max(1, Math.round((Date.now() - new Date(L.start)) / 60000));
  let rpe = L.rpe || 7;
  openPane({title: 'Fin de séance', left: {label: 'Enregistrer', fn: () => saveLive2()}, render: () => `
    <div class="dhead"><div class="eyebrow">${esc(L.name)}</div><div class="big num">${min}<small>min</small></div></div>
    <div class="list"><div class="row col"><label for="fin-rpe">Difficulté ressentie (RPE)<span class="hint">1 = très facile · 10 = effort maximal</span></label><div class="rangeline"><input type="range" id="fin-rpe" min="1" max="10" value="${rpe}" data-finrpe><output>${rpe}</output></div></div>
    <div class="row"><label for="fin-min">Durée<span class="hint">${L.garmin ? 'enregistrée par ta montre' : 'modifiable'}</span></label><input type="number" inputmode="numeric" id="fin-min" value="${min}" style="width:90px;text-align:right" class="mini-in"></div></div>
    <div class="sec-label">Note</div><textarea id="fin-note" rows="3" placeholder="Sensations, douleurs, consignes du coach…">${esc(L.note || '')}</textarea>
    <p class="note" style="text-align:left">En enregistrant, la séance est ajoutée à « Ma journée » dans ${modName('R')} : elle compte dans ton effort du jour et dans ta récupération.</p>
    <div style="margin-top:14px"><button class="btn" data-tsave>Enregistrer la séance</button></div>`});
}
async function saveLive2() {
  const L = S.live; if (!L) return;
  const rpe = +($('#fin-rpe')?.value || 7), min = +($('#fin-min')?.value || 1), note = ($('#fin-note')?.value || '').trim();
  const items = L.items.map(it => it.reps ? {ex: it.ex, pct: it.tg?.pct || null, reps: it.reps.filter(r => r.done).map(r => ({dist: +r.dist || 0, t: +r.t || null}))}
    : {ex: it.ex, ...(it.u === 's' ? {u: 's'} : {}), sets: it.sets.filter(s => s.done).map(s => ({kg: +s.kg || 0, reps: +s.reps || 0}))}).filter(it => (it.reps || it.sets).length);
  if (!items.length) { toast('Valide au moins une série avec ✓'); return; }
  const tonnage = items.reduce((s, it) => s + (it.u === 's' ? 0 : (it.sets || []).reduce((a, x) => a + x.kg * x.reps, 0)), 0);
  const sprintM = items.reduce((s, it) => s + (it.reps && SPRINT_CATS.includes(exOf(it.ex).cat) && (it.pct ?? 100) >= 90 ? it.reps.reduce((a, r) => a + r.dist, 0) : 0), 0);
  const doc = {id: L.id, plan: L.plan, name: L.name, kind: L.kind, date: L.date, start: L.start, min, rpe, note, items, tonnage: Math.round(tonnage), sprintM, updatedAt: new Date().toISOString()};
  S.logs[doc.id] = doc;
  if (!await dbSet('training/' + doc.id, doc)) return;
  await feedReload(L.date);
  S.live = null; saveLive(); stopRest(); closeAllPanes();
  toast(`Séance enregistrée · ajoutée à ${modName('R')}`);
}
// Reload's "Ma journée" is rebuilt from every session logged that day, so it stays right if a session is edited or deleted.
async function feedReload(k) {
  const day = logsOn(k), m = {...(S.manual[k] || {})};
  const part = kind => { const L = day.filter(l => l.kind === kind), mins = L.reduce((s, l) => s + l.min, 0); return L.length ? {min: mins, rpe: Math.round(L.reduce((s, l) => s + l.rpe * l.min, 0) / mins)} : null; };
  const g = part('gym'), t = part('track');
  if (g) { m.gymRpe = g.rpe; m.gymMin = g.min; }
  if (t) { m.trackRpe = t.rpe; m.trackMin = t.min; const sp = day.filter(l => l.kind === 'track').reduce((s, l) => s + (l.sprintM || 0), 0); if (sp) m.sprintM = sp; }
  // A deleted session takes its numbers back out, but only what Training wrote itself.
  if (m.fromTraining && !g) { delete m.gymRpe; delete m.gymMin; }
  if (m.fromTraining && !t) { delete m.trackRpe; delete m.trackMin; delete m.sprintM; }
  m.date = k; m.updatedAt = new Date().toISOString(); m.fromTraining = true;
  S.manual[k] = m;
  await dbSet('manual/' + k, m);
}

    try {
      const ctl = new AbortController(); setTimeout(() => ctl.abort(), 7000);
      const r = await fetch(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(s)}&search_simple=1&action=process&json=1&page_size=12&fields=product_name,brands,nutriments`, {signal: ctl.signal});
      const j = await r.json();
      OFF = {q: s, t: null, res: (j.products || []).map(p => ({n: p.product_name, brand: (p.brands || '').split(',')[0], kcal: +p.nutriments?.['energy-kcal_100g'] || 0, p: +p.nutriments?.proteins_100g || 0, c: +p.nutriments?.carbohydrates_100g || 0, f: +p.nutriments?.fat_100g || 0, g: 100})).filter(p => p.n && p.kcal)};
      const el = $('#ff-off'); if (el && ($('#ff-q')?.value || '').trim().toLowerCase() === s) el.innerHTML = OFF.res.length ? offRows() : '';
    } catch (e) {}
  }, 450);
}
function pickFood(src, meal) {
  let f;
  if (src.startsWith('f:')) f = foodById(src.slice(2));
  else if (src.startsWith('o:')) f = OFF.res[+src.slice(2)];
  else { const it = recents().find(x => x.n === src.slice(2)); if (it) f = {n: it.n, kcal: it.kcal / it.g * 100, p: it.p / it.g * 100, c: it.c / it.g * 100, f: it.f / it.g * 100, g: it.g}; }
  if (!f) return;
  qtyPane(f, meal);
}
function qtyPane(f, meal, editIndex) {
  let g = editIndex != null ? fday(S.fday).items[editIndex].g : f.g || 100;
  const tot = () => { const r = g / 100; return {kcal: f.kcal * r, p: f.p * r, c: f.c * r, f: f.f * r}; };
  openPane({title: editIndex != null ? 'Modifier' : 'Quantité', render: () => { const t = tot(); return `
    <div class="dhead"><div class="bigname">${esc(f.n)}</div><p class="small muted">Pour 100 g : ${fx(f.kcal)} kcal · P ${fx(f.p, 1)} · G ${fx(f.c, 1)} · L ${fx(f.f, 1)}</p></div>
    <div class="qty"><input inputmode="decimal" id="fq-g" value="${g}" data-fqty aria-label="Quantité en grammes"><span>g</span></div>
    <div class="chipsx" style="justify-content:center">${[...new Set([f.g && f.g !== 100 ? f.g : null, 50, 100, 150, 200].filter(Boolean))].map(v => `<button class="chip" data-fqv="${v}">${v} g${v === f.g && f.unit ? ' · ' + esc(f.unit) : ''}</button>`).join('')}</div>
    <div class="stats" id="fq-tot"><div><b>${fx(t.kcal)}</b><span>kcal</span></div><div><b>${fx(t.p, 1)} g</b><span>protéines</span></div><div><b>${fx(t.c, 1)} / ${fx(t.f, 1)}</b><span>glucides / lipides</span></div></div>
    <div class="stack" style="margin-top:16px"><button class="btn" data-fqok>${editIndex != null ? 'Enregistrer' : 'Ajouter'}</button>${editIndex != null ? '<button class="btn ghost" data-fqdel style="color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)">Retirer du journal</button>' : ''}</div>`; },
  setG: v => { g = Math.max(0, +String(v).replace(',', '.') || 0); const t = tot(); const el = $('#fq-tot'); if (el) el.innerHTML = `<div><b>${fx(t.kcal)}</b><span>kcal</span></div><div><b>${fx(t.p, 1)} g</b><span>protéines</span></div><div><b>${fx(t.c, 1)} / ${fx(t.f, 1)}</b><span>glucides / lipides</span></div>`; },
  ok: async () => {
    const t = tot(), d = structuredClone(fday(S.fday)); d.items ||= [];
    const it = {n: f.n, g, kcal: Math.round(t.kcal), p: +t.p.toFixed(1), c: +t.c.toFixed(1), f: +t.f.toFixed(1), meal: editIndex != null ? d.items[editIndex].meal : meal, food: f.id || null};
    if (editIndex != null) d.items[editIndex] = it; else d.items.push(it);
    closeAllPanes(); await saveDay(S.fday, d); toast(editIndex != null ? 'Modifié' : `${f.n} ajouté`);
  },
  del: async () => { const d = structuredClone(fday(S.fday)); d.items.splice(editIndex, 1); closeAllPanes(); await saveDay(S.fday, d); toast('Retiré du journal'); }});
}
function newFood(name, id) {
  const f = id ? {...S.foods[id]} : {id: uid(), n: name || '', kcal: '', p: '', c: '', f: '', g: 100};
  openPane({title: id ? 'Mon aliment' : 'Nouvel aliment', left: {label: 'Enregistrer', fn: async () => {
    document.querySelectorAll('#pane-body [data-nf]').forEach(el => { f[el.dataset.nf] = el.dataset.nf === 'n' ? el.value.trim() : +String(el.value).replace(',', '.') || 0; });
    if (!f.n || !f.kcal) { toast('Il faut au moins un nom et les calories'); return; }
    S.foods[f.id] = f; await dbSet('foods/' + f.id, {...f, updatedAt: new Date().toISOString()}); closePane(); toast('Aliment enregistré'); renderMod();
  }}, render: () => `
    <div class="stack" style="margin-top:16px"><div class="field"><label class="eyebrow" for="nf-n">Nom</label><input id="nf-n" data-nf="n" value="${esc(f.n)}" placeholder="Ex. Skyr vanille"></div>
    <p class="small muted">Valeurs pour 100 g, comme sur l'étiquette.</p>
    <div class="grid4">${[['kcal', 'kcal'], ['p', 'Protéines'], ['c', 'Glucides'], ['f', 'Lipides']].map(([k, l]) => `<label class="field" style="font-size:.6875rem;color:var(--fg2);font-weight:600;text-align:center">${l}<input class="mini-in" inputmode="decimal" data-nf="${k}" value="${f[k]}"></label>`).join('')}</div>
    <div class="field"><label class="eyebrow" for="nf-g">Portion habituelle (g)</label><input id="nf-g" inputmode="numeric" data-nf="g" value="${f.g}"></div>
    ${id ? `<button class="btn ghost" data-fdelfood="${id}" style="color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)">Supprimer</button>` : ''}</div>`});
}

/* ---------- events for home, Training and Fuel ---------- */
document.addEventListener('click', e => {
  const t = e.target, at = s => t.closest(s);
  let b;
  if (at('[data-home]')) { go('home'); return; }
  if (at('[data-hmenu]')) { openDrawer(); return; }
  if (at('[data-hset]')) { closeDrawer(); homeSettings(); return; }
  if ((b = at('[data-hlang]'))) { S.lang = b.dataset.hlang; saveUi(); paneRender(); renderMod(true); return; }
  if ((b = at('[data-mtab]'))) { if (S.mod === 'T') S.ttab = b.dataset.mtab; else S.ftab = b.dataset.mtab; saveUi(); renderMod(true); window.scrollTo(0, 0); return; }
  if ((b = at('[data-ttab]'))) { S.ttab = b.dataset.ttab; saveUi(); renderMod(true); return; }
  if ((b = at('[data-tkind]'))) { S.tkind = b.dataset.tkind; saveUi(); renderMod(); return; }
  if ((b = at('[data-tlibc]'))) { S.lib.cat = b.dataset.tlibc; renderMod(); return; }
  if ((b = at('[data-tprog]'))) { S.prog = b.dataset.tprog; saveUi(); renderMod(true); return; }
  if ((b = at('[data-tplanv]'))) { planView(b.dataset.tplanv); return; }
  if (at('[data-tnew]')) { editPlan(null); return; }
  if (at('[data-tplan]')) { weekPlanner(); return; }
  if ((b = at('[data-tstart]'))) { startSession(b.dataset.tstart); return; }
  if ((b = at('[data-tedit]'))) { editPlan(b.dataset.tedit); return; }
  if ((b = at('[data-tdel]'))) { const p = S.plans[b.dataset.tdel]; if (p) { p.deleted = true; dbSet('plans/' + p.id, p); closeAllPanes(); toast('Séance supprimée'); } return; }
  if ((b = at('[data-tex]'))) { exView(b.dataset.tex); return; }
  if ((b = at('[data-tlog]'))) { logView(b.dataset.tlog); return; }
  if ((b = at('[data-tlogdel]'))) { const l = S.logs[b.dataset.tlogdel]; if (l) { l.deleted = true; dbSet('training/' + l.id, l).then(() => feedReload(l.date)); closeAllPanes(); toast('Séance supprimée'); } return; }
  if (at('[data-tlive]')) { openLive(); return; }
  // Plan editor
  if ((b = at('[data-edkind]'))) { ED.kind = b.dataset.edkind; paneRender(); return; }
  if (at('[data-edadd]')) { pickExercise(ED.kind, id => { ED.items.push(defaultItem(id)); paneRender(); }); return; }
  if ((b = at('[data-edrm]'))) { ED.items.splice(+b.dataset.edrm, 1); paneRender(); return; }
  if ((b = at('[data-edmv]'))) { const [i, d] = b.dataset.edmv.split('.').map(Number), j = i + d; if (j >= 0 && j < ED.items.length) { [ED.items[i], ED.items[j]] = [ED.items[j], ED.items[i]]; paneRender(); } return; }
  if ((b = at('[data-pk]'))) { P.stack.at(-1).pick(b.dataset.pk); return; }
  if (at('[data-panegap]')) { closePane(); return; }
  // Live session
  if ((b = at('[data-tok]'))) {
    const [i, j] = b.dataset.tok.split('.').map(Number), it = S.live.items[i], x = (it.sets || it.reps)[j];
    x.done = !x.done; saveLive(); paneRender();
    if (x.done && PREFS.haptic) navigator.vibrate?.(10);
    return;
  }
  if ((b = at('[data-tlset]'))) { const it = S.live.items[+b.dataset.tlset], arr = it.sets || it.reps, l = arr.at(-1) || {}; arr.push({...l, done: false, t: ''}); saveLive(); paneRender(); return; }
  if ((b = at('[data-tlrm]'))) { const i = +b.dataset.tlrm, [item] = S.live.items.splice(i, 1); (S.live.removed ||= []).push({at: i, item}); saveLive(); paneRender(); return; }
  if ((b = at('[data-tlback]'))) { const [r] = S.live.removed.splice(+b.dataset.tlback, 1); S.live.items.splice(Math.min(r.at, S.live.items.length), 0, r.item); saveLive(); paneRender(); return; }
  if ((b = at('[data-tlu]'))) { const [i, u] = b.dataset.tlu.split('.'); S.live.items[+i].u = u; saveLive(); paneRender(); return; }
  if ((b = at('[data-edu]'))) { const [i, u] = b.dataset.edu.split('.'); ED.items[+i].u = u; if (u === 's' && !ED.items[+i].reps) ED.items[+i].reps = 30; paneRender(); return; }
  if ((b = at('[data-tgfill]'))) { fillFromWatch(b.dataset.tgfill); return; }
  if (at('[data-tladd]')) { pickExercise('any', id => { S.live.items.push(liveItem(defaultItem(id))); saveLive(); paneRender(); }); return; }
  if (at('[data-tfinish]')) { finishPane(); return; }
  if (at('[data-tsave]')) { saveLive2(); return; }
  if (at('[data-tcancel]')) { S.live = null; saveLive(); stopRest(); closeAllPanes(); toast('Séance abandonnée'); return; }
  // Fuel
  if ((b = at('[data-fdayoff]'))) { S.fday = addDays(S.fday, +b.dataset.fdayoff); if (S.fday > TODAY) S.fday = TODAY; renderMod(); return; }
  if ((b = at('[data-fadd]'))) { addFood(b.dataset.fadd); return; }
  if ((b = at('[data-fmeal]'))) { P.stack.at(-1).setMeal(b.dataset.fmeal); return; }
  if ((b = at('[data-fpick]'))) { pickFood(b.dataset.fpick, P.stack.at(-1).meal()); return; }
  if ((b = at('[data-fitem]'))) { const i = +b.dataset.fitem, it = fday(S.fday).items[i]; qtyPane({n: it.n, kcal: it.kcal / it.g * 100, p: it.p / it.g * 100, c: it.c / it.g * 100, f: it.f / it.g * 100, g: it.g, id: it.food}, it.meal, i); return; }
  if ((b = at('[data-fqv]'))) { $('#fq-g').value = b.dataset.fqv; P.stack.at(-1).setG(b.dataset.fqv); return; }
  if (at('[data-fqok]')) { P.stack.at(-1).ok(); return; }
  if (at('[data-fqdel]')) { P.stack.at(-1).del(); return; }
  if ((b = at('[data-fplanmeal]'))) { const m = b.dataset.fplanmeal, d = structuredClone(fday(S.fday)); d.items ||= []; d.items.push(...structuredClone(planItems().filter(it => it.meal === m))); saveDay(S.fday, d); toast('Repas du plan remis'); return; }
  if ((b = at('[data-fplanfill]'))) { saveFset({planFill: b.dataset.fplanfill === 'on'}); return; }
  if ((b = at('[data-fcopy]'))) { const m = b.dataset.fcopy, d = structuredClone(fday(S.fday)); d.items ||= []; d.items.push(...(fday(addDays(S.fday, -1)).items || []).filter(it => it.meal === m)); saveDay(S.fday, d); toast('Repas repris de la veille'); return; }
  if ((b = at('[data-fwater]'))) { const n = +b.dataset.fwater, d = structuredClone(fday(S.fday)); d.items ||= []; d.water = (d.water || 0) === n ? n - 1 : n; saveDay(S.fday, d); return; }
  if ((b = at('[data-fnewfood]'))) { newFood(b.dataset.fnewfood || ''); return; }
  if ((b = at('[data-fmine]'))) { newFood('', b.dataset.fmine); return; }
  if ((b = at('[data-fdelfood]'))) { const f = S.foods[b.dataset.fdelfood]; if (f) { f.deleted = true; dbSet('foods/' + f.id, f); closePane(); renderMod(); toast('Aliment supprimé'); } return; }
  if ((b = at('[data-fgoal]'))) { saveFset({goal: b.dataset.fgoal}); return; }
});
document.addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if (d.tlibq !== undefined) { S.lib.q = t.value; $('#t-libl').innerHTML = libRows(); }
  else if (d.pkq !== undefined) P.stack.at(-1).setQ(t.value);
  else if (d.ffq !== undefined) P.stack.at(-1).setQ(t.value);
  else if (d.fqty !== undefined) P.stack.at(-1).setG(t.value);
  else if (d.lv) {
    const [i, j, f] = d.lv.split('.'), arr = S.live.items[i].sets || S.live.items[i].reps, old = arr[j][f], v = t.value.replace(',', '.');
    arr[j][f] = v;
    // A load typed on one set is carried to the next sets not done yet, like the gym apps do.
    if (f === 'kg') for (let n = +j + 1; n < arr.length; n++) if (!arr[n].done && (arr[n].kg === '' || arr[n].kg === old)) { arr[n].kg = v; const el = document.querySelector(`[data-lv="${i}.${n}.kg"]`); if (el) el.value = v; }
    saveLive();
  }
  else if (d.ed) { const [i, f] = d.ed.split('.'); if (f) ED.items[i][f] = t.value === '' ? null : +t.value; else ED[i] = t.value; }
  else if (d.finrpe !== undefined) t.nextElementSibling.textContent = t.value;
  else if (d.fprot !== undefined) t.nextElementSibling.textContent = fx(+t.value, 1);
});
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  if (d.tweek !== undefined) { const week = {...(S.tset.week || {})}; if (t.value) week[d.tweek] = t.value; else delete week[d.tweek]; S.tset.week = week; dbSet('settings/training', {...S.tset, updatedAt: new Date().toISOString()}); renderMod(); }
  else if (d.fprot !== undefined) saveFset({protein: +t.value});
  else if (d.fkcal !== undefined) saveFset({kcal: +t.value || null});
  else if (d.fwatergoal !== undefined) saveFset({water: Math.max(1, +t.value || 10)});
});
$('#pn-close').addEventListener('click', closePane);
$('#pn-left').addEventListener('click', () => P.stack.at(-1)?.left?.fn());
$('#scrim').addEventListener('click', () => { if (P.stack.length) closeAllPanes(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && P.stack.length) closePane(); });
// The live session clock ticks while its sheet is open.
setInterval(() => { if (P.live && S.live) { const b = $('#pane-body .livehead b'); if (b) b.textContent = Math.max(0, Math.floor((Date.now() - new Date(S.live.start)) / 60000)) + ' min'; } }, 15000);
function bootTNR(db) {
  const col = (name, key) => db.collection(name).onSnapshot(snap => { const o = {}; snap.docs.forEach(d => o[d.id] = d.data()); S[key] = o; renderMod(); }, () => {});
  col('plans', 'plans'); col('training', 'logs'); col('fuel', 'fuel'); col('foods', 'foods');
  db.doc('settings/training').onSnapshot(s => { S.tset = s.exists ? s.data() : {}; renderMod(); }, () => {});
  db.doc('settings/fuel').onSnapshot(s => { S.fset = s.exists ? s.data() : {}; renderMod(); }, () => {});
  db.doc('tdv/main').onSnapshot(s => { const d = s.exists ? s.data() : {}; TDV_PLANS = d.plans || []; TDV_FUEL = d.fuel || null; TDV_PROTO = d.proto || []; renderMod(); if (S.mod === 'R') render(); }, () => {});
}

/* ---------- boot ---------- */
// The page ends just above the tab bar, whatever its real height on the phone, so the sources line shows with some air.
const fitTabbar = () => { const t = document.querySelector('.mod:not([hidden]) .tabbar'); if (t) document.documentElement.style.setProperty('--tbh', t.offsetHeight + 'px'); };
fitTabbar(); addEventListener('resize', fitTabbar);
try { const t = localStorage.getItem('sl-tab');  const g = localStorage.getItem('sl-gran'); if (GRAN.some(([x]) => x === g)) S.gran = g; } catch (e) {}
setTab(S.tab);
go('home', false);
(async () => {
  const db = await recupGetDb();
  if (!db) { S.status = 'offline'; render(); return; }
  S.db = db;
  let fresh = false;
  const timer = setTimeout(() => { if (!fresh) { S.status = 'slow'; render(); } }, 10000);
  const ok = snap => { if (!snap.metadata.fromCache && !fresh) { fresh = true; clearTimeout(timer); S.status = 'ready'; } };
  const fail = () => { clearTimeout(timer); S.status = 'slow'; render(); };
  const months = (col, target) => db.collection(col).onSnapshot(snap => {
    const o = {}; let synced = S.syncedAt;
    let own = null;
    snap.docs.forEach(d => { const x = d.data(); Object.assign(o, x.days || {}); if (x.hrMax) S.hrMax = x.hrMax; if (x.syncedAt && (!own || x.syncedAt > own)) own = x.syncedAt; });
    if (own && (!synced || own > synced)) synced = own;
    S[target] = o; S.syncedAt = synced; (S.sync ||= {})[col] = own; REST = null; ok(snap); render();
  }, fail);
  months('garmin', 'g'); months('withings', 'w');
  db.collection('manual').onSnapshot(snap => { const o = {}; snap.docs.forEach(d => o[d.id] = d.data()); S.manual = o; render(); }, fail);
  db.collection('reports').onSnapshot(snap => { S.reports = snap.docs.map(d => ({id: d.id, ...d.data()})); render(); }, fail);
  db.doc('analysis/latest').onSnapshot(snap => { S.analysis = snap.exists ? snap.data() : null; render(); }, fail);
  db.doc('settings/app').onSnapshot(snap => { S.app = snap.exists ? snap.data() : {}; render(); renderMod(); }, () => {});
  db.doc('requests/sync').onSnapshot(snap => { S.req = snap.exists ? snap.data().requestedAt : null; render(); }, () => {});
  db.doc('status/sync').onSnapshot(snap => { S.checked = snap.exists ? snap.data() : null; render(); }, () => {});
  db.doc('profile/main').onSnapshot(snap => { S.profile = snap.exists ? snap.data() : null; render(); }, fail);
  bootTNR(db);
  // Back from the Withings sign-in page: say how it went, show the settings, then fetch the data.
  if (window.RECUP_WITHINGS_DONE) window.RECUP_WITHINGS_DONE.then(m => { homeSettings(); toast(m); if (/connecté/.test(m)) refreshAll(); });
  else if (PREFS.autoSync && window.RECUP_SYNC) refreshAll();
})();
</script>
